<title>PM Task Board</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#F7F8FB; --ink:#1A1D26; --ink-2:#4B5063; --muted:#8A90A2; --line:#E6E8F0; --line-2:#EEF0F5;
  --primary:#5D4FE8; --primary-ink:#FFFFFF; --primary-soft:#ECEAFD;
  --backlog:#8A90A2; --backlog-soft:#EEF0F5;
  --todo:#E5484D; --todo-soft:#FDECEC; --prog:#2F6FED; --prog-soft:#E8F0FE; --review:#E1A100; --review-soft:#FEF4DC; --done:#22A06B; --done-soft:#E3F6EC;
  --client:#7A5AF8; --client-soft:#F0ECFE;
  --shadow:0 1px 2px rgba(20,24,40,.04),0 6px 20px rgba(20,24,40,.06); --shadow-lg:0 12px 40px rgba(20,24,40,.18);
  --r:12px; --r-sm:8px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1218; --surface:#171B23; --surface-2:#1E232D; --ink:#E8EAF0; --ink-2:#B4B9C8; --muted:#7E859A; --line:#2A3040; --line-2:#242A38;
    --primary:#8B7CFF; --primary-ink:#0F1218; --primary-soft:#2A2650; --backlog:#7E859A; --backlog-soft:#242A38;
    --todo:#F0716F; --todo-soft:#3C2224; --prog:#6A9BFF; --prog-soft:#1E2A45; --review:#F2BE4A; --review-soft:#3B3117; --done:#4FC48F; --done-soft:#173427;
    --client:#B39BE0; --client-soft:#2E2540;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3); --shadow-lg:0 12px 40px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1218; --surface:#171B23; --surface-2:#1E232D; --ink:#E8EAF0; --ink-2:#B4B9C8; --muted:#7E859A; --line:#2A3040; --line-2:#242A38;
  --primary:#8B7CFF; --primary-ink:#0F1218; --primary-soft:#2A2650; --backlog:#7E859A; --backlog-soft:#242A38;
  --todo:#F0716F; --todo-soft:#3C2224; --prog:#6A9BFF; --prog-soft:#1E2A45; --review:#F2BE4A; --review-soft:#3B3117; --done:#4FC48F; --done-soft:#173427;
  --client:#B39BE0; --client-soft:#2E2540;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3); --shadow-lg:0 12px 40px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
svg{display:block;flex:none}
.muted{color:var(--muted)} .small{font-size:12px}
[hidden]{display:none!important}

/* Shell */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);height:100%;background:var(--surface)}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.ws{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.ws .logo{width:40px;height:40px;border-radius:11px;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none}
.ws .name{font-weight:700;font-size:15px;line-height:1.2}
.ws .sub{font-size:12px;color:var(--muted)}
.side-scroll{overflow:auto;padding:6px 10px 24px;flex:1;min-height:0}
.sec{padding:14px 8px 4px;display:flex;justify-content:space-between;align-items:center}
.sec h4{margin:0;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sec button{border:0;background:transparent;color:var(--muted);height:24px;padding:0 6px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;font-size:12px}
.sec button:hover{background:var(--surface-2);color:var(--ink)}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.nav .item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:var(--r-sm);color:var(--ink-2);font-size:14px;min-height:34px}
.nav .item:hover{background:var(--surface-2);color:var(--ink)}
.nav .item[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav .item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .item .n{font-size:12px;color:var(--muted);font-weight:500}
.nav .item .chev{color:var(--muted);transition:transform .15s}
.nav .item[aria-expanded="true"] .chev{transform:rotate(180deg)}
.nav .sub{list-style:none;margin:0 0 0 14px;padding:0 0 0 12px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.dot.backlog{background:var(--backlog)} .dot.todo{background:var(--todo)} .dot.in_progress{background:var(--prog)} .dot.review{background:var(--review)} .dot.done{background:var(--done)}
.dot.ring{background:transparent;border:2px solid currentColor;width:10px;height:10px}
.team .who{display:flex;flex-direction:column;min-width:0;flex:1}
.team .who b{font-weight:600;font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .who span{font-size:12px;color:var(--muted)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#1A1D26;flex:none;border:2px solid var(--surface)}
.av.sm{width:24px;height:24px;font-size:10px}
.avs{display:flex}
.avs .av+.av{margin-left:-8px}
.avs .more{background:var(--surface-2);color:var(--ink-2);font-size:11px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface)}
.content{flex:1;min-height:0;overflow:auto;padding:22px 28px 32px;display:flex;flex-direction:column;gap:16px}
.proj{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.proj h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1;flex:1;min-width:0}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.shared i{background:var(--done)} .sync.local i{background:var(--review)}
.menu-btn{display:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;line-height:1.3;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--todo);border-color:var(--todo)}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:0;background:transparent;width:30px;height:30px;border-radius:8px;color:var(--muted);display:grid;place-items:center;padding:0}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}

.toolbar{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs{display:flex;gap:2px;flex:1;min-width:0}
.tab{border:0;background:transparent;padding:8px 12px 12px;color:var(--muted);font-weight:500;display:inline-flex;align-items:center;gap:8px;position:relative;font-size:15px}
.tab:hover{color:var(--ink)}
.tab[aria-pressed="true"]{color:var(--primary);font-weight:600}
.tab[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--primary);border-radius:2px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 12px;height:38px;min-width:220px;background:var(--surface);margin-bottom:8px;color:var(--muted)}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;color:var(--ink)}
.filter-wrap{position:relative;margin-bottom:8px}
.pop{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:14px;width:260px;z-index:20;display:flex;flex-direction:column;gap:12px}
.pop label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--ink-2)}
.pop select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;min-height:36px;font-weight:400}
.active-filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.active-filters .af{display:inline-flex;align-items:center;gap:6px;background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:3px 6px 3px 10px;font-weight:500}
.active-filters .af button{border:0;background:transparent;color:inherit;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;padding:0}
.active-filters .clear{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0 4px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--primary-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:13px}

/* Kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:14px;overflow-x:auto;padding-bottom:12px;align-items:start;min-height:320px}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.col-head{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:8px 8px 8px 14px;background:var(--surface)}
.col-head h3{margin:0;font-size:14px;font-weight:600;flex:1;white-space:nowrap}
.count{font-size:12px;font-weight:600;border-radius:6px;padding:1px 8px;min-width:24px;text-align:center}
.count.backlog{background:var(--backlog-soft);color:var(--backlog)} .count.todo{background:var(--todo-soft);color:var(--todo)} .count.in_progress{background:var(--prog-soft);color:var(--prog)} .count.review{background:var(--review-soft);color:var(--review)} .count.done{background:var(--done-soft);color:var(--done)}
.col-body{display:flex;flex-direction:column;gap:12px;min-height:120px;border-radius:var(--r)}
.col.over .col-body{background:var(--primary-soft);outline:2px dashed var(--primary);outline-offset:-2px}
.col-empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px 12px;text-align:center;color:var(--muted);font-size:13px}
.arch{border:0;background:transparent;color:var(--muted);font-size:12px;text-decoration:underline;padding:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;box-shadow:var(--shadow);position:relative;cursor:pointer;display:flex;flex-direction:column;gap:9px;transition:transform .12s,box-shadow .12s}
.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.card.dragging{opacity:.45}
.card.sel{outline:2px solid var(--primary);outline-offset:-1px}
.card-top{display:flex;align-items:flex-start;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.chip{font-size:12px;font-weight:500;border-radius:6px;padding:2px 8px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.backlog{background:var(--backlog-soft);color:var(--backlog)} .chip.todo{background:var(--todo-soft);color:var(--todo)} .chip.in_progress{background:var(--prog-soft);color:var(--prog)} .chip.review{background:var(--review-soft);color:var(--review)} .chip.done{background:var(--done-soft);color:var(--done)}
.chip.client{background:var(--client-soft);color:var(--client)}
.chip.ex{border:1px dashed var(--line);background:transparent;color:var(--muted)}
.chip.p1{background:var(--todo);color:#fff;font-weight:700} .chip.p2{background:var(--surface-2);color:var(--ink-2)} .chip.p3{background:transparent;border:1px solid var(--line);color:var(--muted)}
.card h3{margin:0;font-size:15px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.card.done h3{color:var(--muted)}
.card p{margin:0;color:var(--ink-2);font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-2)}
.prog .segs{flex:1}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.segs.backlog i.on{background:var(--backlog)} .segs.todo i.on{background:var(--todo)} .segs.in_progress i.on{background:var(--prog)} .segs.review i.on{background:var(--review)} .segs.done i.on{background:var(--done)}
.segs.cont{position:relative;background:var(--line);height:5px;border-radius:3px;overflow:hidden}
.segs.cont b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--prog)}
.segs.cont.done b{background:var(--done)} .segs.cont.review b{background:var(--review)} .segs.cont.todo b{background:var(--todo)}
.dates{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.dates svg{color:var(--muted)}
.badge{display:inline-block;font-size:11px;border-radius:6px;padding:2px 8px;font-weight:600;white-space:nowrap}
.badge.crit{background:var(--todo-soft);color:var(--todo)} .badge.warn{background:var(--review-soft);color:var(--review)} .badge.good{background:var(--done-soft);color:var(--done)} .badge.mutedb{background:var(--surface-2);color:var(--muted)} .badge.blk{background:var(--todo);color:#fff}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.meta{display:flex;gap:10px;color:var(--muted);font-size:12px;align-items:center}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta span.warnc{color:var(--review)}
.cmenu{position:absolute;right:10px;top:40px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;z-index:15;display:flex;flex-direction:column;min-width:170px}
.cmenu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;font-size:13px;display:flex;align-items:center;gap:8px}
.cmenu button:hover{background:var(--surface-2)}
.cmenu button.del{color:var(--todo)}

/* List */
.table{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.trow,.thead{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1.1fr) minmax(0,1.6fr) minmax(0,1fr) minmax(0,.9fr) minmax(0,.9fr);gap:12px;align-items:center;padding:11px 16px}
.thead{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}
.trow{border-bottom:1px solid var(--line-2);cursor:pointer}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--surface-2)}
.trow .t{font-weight:600;overflow-wrap:anywhere}
.trow .c-owner{display:flex;align-items:center;gap:8px;min-width:0}
.trow .c-owner span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-lbl{display:none}
.empty{padding:56px 24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty h3{color:var(--ink);margin:0 0 6px;font-weight:600;font-size:17px}
.empty .btns{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}

/* Timeline */
.gantt-wrap{border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.gantt{min-width:max-content}
.g-row{display:grid;grid-template-columns:250px var(--tw);border-bottom:1px solid var(--line-2)}
.g-row:last-child{border-bottom:0}
.g-label{position:sticky;left:0;background:var(--surface);z-index:2;padding:9px 14px;border-right:1px solid var(--line);min-width:0;display:flex;gap:10px;align-items:center}
.g-row.head .g-label{background:var(--surface-2);font-size:12px;color:var(--muted);font-weight:600}
.g-label .t{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-label .o{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-track{position:relative;min-height:50px;background-image:linear-gradient(to right,var(--line-2) 1px,transparent 1px);background-size:var(--cw) 100%}
.g-row.head .g-track{background-color:var(--surface-2);min-height:auto;display:flex}
.g-week{width:var(--cw);flex:none;padding:8px;font-size:11px;color:var(--muted);border-left:1px solid var(--line-2);white-space:nowrap}
.g-week b{display:block;font-weight:700;color:var(--ink-2)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--todo);opacity:.8;z-index:1}
.g-row.head .g-today{display:none}
.g-bar{position:absolute;top:12px;height:26px;border-radius:7px;overflow:hidden;cursor:pointer;display:flex;align-items:center;min-width:8px;border:1px solid}
.g-bar .fill{position:absolute;inset:0;width:var(--p);opacity:.35}
.g-bar .txt{position:relative;padding:0 9px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-bar.todo{background:var(--todo-soft);border-color:var(--todo);color:var(--todo)} .g-bar.todo .fill{background:var(--todo)}
.g-bar.in_progress{background:var(--prog-soft);border-color:var(--prog);color:var(--prog)} .g-bar.in_progress .fill{background:var(--prog)}
.g-bar.review{background:var(--review-soft);border-color:var(--review);color:var(--review)} .g-bar.review .fill{background:var(--review)}
.g-bar.done{background:var(--done-soft);border-color:var(--done);color:var(--done)} .g-bar.done .fill{background:var(--done)}
.g-bar.backlog{background:var(--backlog-soft);border-color:var(--backlog);color:var(--backlog)} .g-bar.backlog .fill{background:var(--backlog)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Report */
.report{display:flex;flex-direction:column;gap:18px}
.rep-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rep-bar .week{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:2px}
.rep-bar .week b{padding:0 10px;font-weight:600;white-space:nowrap}
.rep-bar .spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 12px;color:var(--ink-2);font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.stat .n{font-size:26px;font-weight:700;line-height:1.1;margin-top:2px}
.stat.crit .n{color:var(--todo)} .stat.warn .n{color:var(--review)} .stat.good .n{color:var(--done)} .stat.prog .n{color:var(--prog)}
.rsec{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rsec>h3{margin:0;padding:10px 16px;font-size:14px;font-weight:600;background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.rsec>h3 .count{margin-left:auto}
.rsec .none{padding:14px 16px;color:var(--muted);font-size:13px}
.rsec h5{margin:0;padding:8px 16px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:8px}
.rline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:11px 16px;border-bottom:1px solid var(--line-2);cursor:pointer}
.rline:last-child{border-bottom:0}
.rline:hover{background:var(--surface-2)}
.rline .t{font-weight:600}
.rline .s{font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rline .u{grid-column:1/-1;font-size:13px;color:var(--ink-2);border-left:3px solid var(--primary-soft);padding-left:10px;margin-top:2px}

(function(){
'use strict';

/* ---------- Reference data ---------- */
const KINDS = {
  'product-dev':{label:'Product development',group:'Product'}, 'product-improve':{label:'Product improvement',group:'Product'}, 'product-other':{label:'Product task',group:'Product'},

};
const PRODUCTS = { Evaluate:['Conversation AI','Nano AI','PitchPerfect AI'], Educate:['AI Microlearn','Interactive Learn'], Experience:['Simulations','AI RolePlay'], Enable:['AI Koach'] };
const STATUS = { backlog:{label:'Backlog'}, todo:{label:'To Do'}, in_progress:{label:'In Progress'}, review:{label:'Review'}, done:{label:'Complete'} };
const LEGACY = { not_started:'todo', blocked:'review' };
const PRIO = {1:'P1',2:'P2',3:'P3'};
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAY = 86400000, ARCHIVE_DAYS = 14, MAX_ACTIVITY = 60;
const AV_COLORS = ['#F6C6C0','#C9DDF7','#F8E3B0','#C6EBD3','#DED5F7','#F7D6E8','#CDEBF3','#F3D9C0'];

/* ---------- Helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function parseD(s){ if(!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d); return isNaN(dt)?null:dt; }
function toISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function today(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function daysBetween(a,b){ return Math.round((b-a)/DAY); }
function weekStart(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); return addDays(x, -((x.getDay()+6)%7)); }
function fmtD(s, withYear){ const d=parseD(s); if(!d) return 'No date'; return d.getDate()+' '+MON[d.getMonth()]+((withYear||d.getFullYear()!==today().getFullYear())?' '+d.getFullYear():''); }
function fmtRange(a,b){ return (a||b) ? fmtD(a)+' to '+fmtD(b) : 'Not scheduled'; }
function fmtTs(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; return d.getDate()+' '+MON[d.getMonth()]+', '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function lsGet(k, fb){ try{ const v=localStorage.getItem(k); return v==null?fb:JSON.parse(v);}catch(e){ return fb; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function hash(s){ let h=0; for(const c of String(s)) h=(h*31 + c.charCodeAt(0))>>>0; return h; }
function initials(n){ const p=String(n||'?').trim().split(/\s+/); return ((p[0]||'?')[0]+(p[1]?p[1][0]:'')).toUpperCase(); }
function avatar(name, cls){ const c=AV_COLORS[hash(name||'')%AV_COLORS.length]; return '<span class="av '+(cls||'')+'" style="background:'+c+'" title="'+esc(name||'Unassigned')+'">'+esc(initials(name))+'</span>'; }

  dots:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',

/* ---------- State ---------- */
const state = {
  tasks:new Map(), team:[], mode:'connecting', readOnly:false, uid:null, user:null, downloads:null, names:{},
  view: lsGet('pmt.view','kanban'),
  filters:{owner:'all', product:'all', group:'all', status:'all', q:''},
  openGroups:new Set(lsGet('pmt.groups', [])),
  drawerId:null, menuId:null, confirmDelete:false, editingId:null, dragId:null, sideOpen:false, filterOpen:false, showArchived:false, blockForm:false,
  reportWeek: weekStart(today()), reportBy:'all',
};
if (!['kanban','list','timeline','report'].includes(state.view)) state.view='kanban';

/* ---------- Storage ---------- */
const store = {
  col:null, teamDoc:null, queues:new Map(),
  async init(){
    let db=null, user=null;
    try { if (window.claude && typeof window.claude.use==='function') { [db, user, state.downloads] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads')]); } } catch(e){ db=null; }
    if (user) { state.user=user; try { state.uid = await user.id(); const w = await user.can('data.write'); if (w===false) state.readOnly=true; } catch(e){} }
    if (db) {
      state.mode='shared'; this.col=db.collection('tasks'); this.teamDoc=db.doc('settings/team');
      this.col.onSnapshot(snap => { const next=new Map(); snap.docs.forEach(d => { const b=d.data(); if (b) next.set(d.id, norm(Object.assign({}, b, {id:d.id}))); }); state.tasks=next; render(); },
        err => { state.mode='local'; toast('Live sync stopped ('+(err&&err.code||'unavailable')+'). Reload to reconnect.'); render(); });
      this.teamDoc.onSnapshot(snap => { const b=snap.exists?snap.data():null; state.team = (b && Array.isArray(b.members)) ? b.members.filter(x=>typeof x==='string') : []; render(); }, ()=>{});
    } else {
      state.mode='local'; state.tasks=new Map(lsGet('pmt.tasks',[]).map(t=>[t.id,norm(t)])); state.team=lsGet('pmt.team',[]); render();
    }
  },
  persistLocal(){ lsSet('pmt.tasks',[...state.tasks.values()]); lsSet('pmt.team', state.team); },
  chain(id, fn){ const prev=this.queues.get(id)||Promise.resolve(); const next=prev.then(fn,fn).catch(err=>this.onError(err)); this.queues.set(id,next); return next; },
  onError(err){
    const code=err&&err.code;
    if (code==='invalid_argument') { state.readOnly=true; toast('Change not saved. You have view-only access to this board.'); render(); }
    else if (code==='quota_exceeded') toast('The board is full. Delete finished tasks to add more.');
    else toast('Could not save ('+(code||'error')+'). Try again.');
  },
  save(task, opts){
    opts=opts||{};
    const prev=state.tasks.get(task.id);
    const now=new Date().toISOString();
    if (!opts.silent) { const acts=diffActivity(prev, task, now); if (acts.length) task.activity=(task.activity||[]).concat(acts).slice(-MAX_ACTIVITY); }
    if (task.status==='done' && !(prev && prev.status==='done')) task.completedAt=now;
    if (task.status!=='done' && prev && prev.status==='done') task.completedAt=null;
    if (task.status==='in_progress' && !task.startedAt && !(prev && prev.status==='in_progress')) task.startedAt=now;
    if (!task.endOriginal && task.end) task.endOriginal=task.end;
    task.updatedAt=now; task.updatedBy=state.uid||null;
    state.tasks.set(task.id, task); render();
    if (state.mode==='shared' && this.col) { const body=Object.assign({}, task); delete body.id; return this.chain(task.id, ()=>this.col.doc(task.id).set(body)); }
    this.persistLocal(); return Promise.resolve();
  },
  remove(id){
    state.tasks.delete(id);
    state.tasks.forEach(t => { if (t.dependsOn.includes(id)) { t.dependsOn=t.dependsOn.filter(x=>x!==id); if (state.mode==='shared'&&this.col) { const body=Object.assign({},t); delete body.id; this.chain(t.id, ()=>this.col.doc(t.id).set(body)); } } });
    render();
    if (state.mode==='shared' && this.col) return this.chain(id, ()=>this.col.doc(id).delete());
    this.persistLocal(); return Promise.resolve();
  },
  saveTeam(members){
    state.team=members; render();
    if (state.mode==='shared' && this.teamDoc) return this.chain('settings/team', ()=>this.teamDoc.set({members}));
    this.persistLocal(); return Promise.resolve();
  },
};
function act(type, text, at){ return {at, by: state.mode==='shared' ? (state.uid||null) : 'local', type, text}; }
function diffActivity(prev, next, now){
  const a=[];
  if (!prev) { a.push(act('created', 'Created in '+STATUS[next.status].label+(next.owner?' for '+next.owner:''), now)); return a; }
  if (prev.status!==next.status) a.push(act('status', 'Moved from '+STATUS[prev.status].label+' to '+STATUS[next.status].label, now));
  if ((prev.start||'')!==(next.start||'')) a.push(act('dates', 'Start date changed from '+fmtD(prev.start)+' to '+fmtD(next.start), now));
  if ((prev.end||'')!==(next.end||'')) a.push(act('dates', 'End date changed from '+fmtD(prev.end)+' to '+fmtD(next.end), now));
  if ((prev.owner||'')!==(next.owner||'')) a.push(act('edit', 'Owner changed from '+(prev.owner||'nobody')+' to '+(next.owner||'nobody'), now));
  if (prev.priority!==next.priority) a.push(act('edit', 'Priority changed to '+PRIO[next.priority], now));
  if ((prev.title||'')!==(next.title||'')) a.push(act('edit', 'Renamed to "'+next.title+'"', now));
  const pb=!!prev.blocked, nb=!!next.blocked;
  if (!pb && nb) a.push(act('blocked', 'Marked blocked: '+(next.blocked.reason||'no reason given'), now));
  if (pb && !nb) a.push(act('unblocked', 'Unblocked', now));
  const pm=new Map((prev.subtasks||[]).map(s=>[s.id,s]));
  (next.subtasks||[]).forEach(s => { const o=pm.get(s.id); if (o && !!o.done!==!!s.done) a.push(act('check', (s.done?'Completed':'Reopened')+' checklist item "'+s.text+'"', now)); });
  const added=(next.subtasks||[]).filter(s=>!pm.has(s.id)).length, removed=(prev.subtasks||[]).filter(s=>!(next.subtasks||[]).some(x=>x.id===s.id)).length;
  if (added) a.push(act('edit', added+' checklist item'+(added>1?'s':'')+' added', now));
  if (removed) a.push(act('edit', removed+' checklist item'+(removed>1?'s':'')+' removed', now));
  if ((prev.dependsOn||[]).join()!==(next.dependsOn||[]).join()) a.push(act('edit', 'Dependencies changed', now));
  if ((prev.updates||[]).length < (next.updates||[]).length) a.push(act('update', 'Weekly update added', now));
  return a;
}
async function resolveNames(ids){
  const need=[...new Set(ids.filter(id => id && id!=='local' && !(id in state.names)))];
  if (need.length && state.user) { try { const ps=await state.user.profiles(need); need.forEach(id => { state.names[id]=(ps[id]&&ps[id].name)||''; }); } catch(e){ need.forEach(id=>{ state.names[id]=''; }); } }
  document.querySelectorAll('[data-uid]').forEach(el => { el.textContent = nameOf(el.dataset.uid); });
}
function nameOf(id){ if (!id) return 'Someone'; if (id==='local') return 'You'; if (id===state.uid) return 'You'; return state.names[id] || 'Someone'; }
function who(id){ return '<span data-uid="'+esc(id||'')+'">'+esc(nameOf(id))+'</span>'; }

/* ---------- Derived ---------- */
function subProgress(t){ const s=t.subtasks; const done=s.filter(x=>x.done).length; return {done,total:s.length,pct:s.length?Math.round(done/s.length*100):(t.status==='done'?100:0)}; }
function depsOf(t){ return t.dependsOn.map(id=>state.tasks.get(id)).filter(Boolean); }
function waitingOn(t){ return depsOf(t).filter(d=>d.status!=='done'); }
function dependentsOf(id){ return [...state.tasks.values()].filter(t=>t.dependsOn.includes(id)); }
function transitiveDependents(id){ const seen=new Set(); const stack=[id]; while(stack.length){ const cur=stack.pop(); dependentsOf(cur).forEach(t=>{ if(!seen.has(t.id)){ seen.add(t.id); stack.push(t.id);} }); } return seen; }
function isOpen(t){ return t.status!=='done' && t.status!=='backlog'; }
function isOverdue(t){ const e=parseD(t.end); return isOpen(t) && e && e<today(); }
function isDueWeek(t){ const e=parseD(t.end), t0=today(); return isOpen(t) && e && e>=t0 && e<=addDays(t0,7); }
function isLateStart(t){ const s=parseD(t.start); return t.status==='todo' && s && s<today(); }
function slipDays(t){ const a=parseD(t.endOriginal), b=parseD(t.end); return (a&&b&&b>a)?daysBetween(a,b):0; }
function isArchived(t){ if (t.status!=='done') return false; const d=new Date(t.completedAt||t.updatedAt||0); return daysBetween(d, new Date()) > ARCHIVE_DAYS; }
function dueInfo(t){
  if (t.status==='done') return null; if (t.status==='backlog') return null;
  const e=parseD(t.end), t0=today(); if(!e) return null;
  const n=daysBetween(t0,e);
  if (n<0) return {cls:'crit', text:'Overdue '+(-n)+'d'};
  if (isLateStart(t)) return {cls:'crit', text:'Late start '+daysBetween(parseD(t.start),t0)+'d'};
  if (n===0) return {cls:'warn', text:'Due today'};
  if (n<=7) return {cls:'warn', text:'Due in '+n+'d'};
  return null;
}
function ownerList(){ const set=new Set(state.team); state.tasks.forEach(t=>{ if (t.owner) set.add(t.owner.trim()); }); return [...set].sort((a,b)=>a.localeCompare(b)); }
function productGroup(p){ return Object.keys(PRODUCTS).find(g=>PRODUCTS[g].includes(p))||''; }
function filtered(ignoreStatus){
  const f=state.filters, q=f.q.trim().toLowerCase();
  return [...state.tasks.values()].filter(t => {
    if (f.owner!=='all' && (t.owner||'').trim()!==f.owner) return false;
    if (f.product!=='all') { if (PRODUCTS[f.product]) { if (!PRODUCTS[f.product].includes(t.product)) return false; } else if (t.product!==f.product) return false; }
    if (f.group!=='all' && (KINDS[t.kind]||{}).group!==f.group) return false;
    if (!ignoreStatus && f.status!=='all') {
      if (f.status==='open') { if (!isOpen(t)) return false; }
      else if (f.status==='overdue') { if (!isOverdue(t)) return false; }
      else if (f.status==='dueweek') { if (!isDueWeek(t)) return false; }
      else if (f.status==='blocked') { if (!t.blocked || t.status==='done') return false; }
      else if (f.status==='waiting') { if (t.status==='done' || !waitingOn(t).length) return false; }
      else if (t.status!==f.status) return false;
    }
    if (q) { const hay=[t.title,t.client,t.product,t.owner,t.notes,(KINDS[t.kind]||{}).label,...t.subtasks.map(s=>s.text)].join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  }).sort((a,b) => (a.priority-b.priority) || (a.start||'9999').localeCompare(b.start||'9999') || (a.end||'9999').localeCompare(b.end||'9999') || (a.title||'').localeCompare(b.title||''));
}

/* ---------- Render ---------- */
function render(){
  renderSide(); renderTop(); renderActiveFilters(); renderBanner();
  document.querySelectorAll('[data-action="view"]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.view===state.view)));
  const main=$('#main');
  if (state.tasks.size===0) main.innerHTML=emptyState();
  else if (state.view==='report') main.innerHTML=renderReport();
  else {
    const list=filtered();
    if (!list.length) main.innerHTML='<div class="empty"><h3>No tasks match these filters</h3><p>Try another owner, product or status, or clear the search.</p><div class="btns"><button type="button" class="btn" data-action="clear-filters">Clear filters</button></div></div>';
    else main.innerHTML = state.view==='kanban' ? renderKanban(list) : state.view==='list' ? renderList(list) : renderTimeline(list);
  }
  renderDrawer();
  $('#app').classList.toggle('side-open', state.sideOpen);
  $('#filterPop').hidden=!state.filterOpen; $('#filterBtn').setAttribute('aria-expanded', String(state.filterOpen));
  $('#scrim').hidden=!(state.drawerId||state.sideOpen);
  resolveNames([...document.querySelectorAll('[data-uid]')].map(el=>el.dataset.uid));
}
function renderTop(){
  const s=$('#sync'); s.className='sync '+state.mode;
  s.lastElementChild.textContent = state.mode==='shared' ? (state.readOnly?'Shared, view only':'Shared, live') : state.mode==='local' ? 'This browser only' : 'Connecting';
  const owners=ownerList();
  $('#headAvs').innerHTML = owners.slice(0,4).map(o=>avatar(o)).join('') + (owners.length>4?'<span class="av more">+'+(owners.length-4)+'</span>':'');
  $('#f-groupFilter').value=state.filters.group; $('#f-statusFilter').value=state.filters.status;
  if ($('#f-search').value!==state.filters.q) $('#f-search').value=state.filters.q;
}
function renderSide(){
  const f=state.filters, all=[...state.tasks.values()], open=all.filter(isOpen);
  const cnt=fn=>open.filter(fn).length;
  const item=o=>'<li><button type="button" class="item" data-action="'+o.action+'" '+(o.data||'')+' aria-pressed="'+!!o.on+'" '+(o.exp!==undefined?'aria-expanded="'+o.exp+'"':'')+'>'+(o.icon||'')+'<span class="lbl">'+esc(o.label)+'</span>'+(o.n!==undefined?'<span class="n">'+o.n+'</span>':'')+(o.exp!==undefined?I.chev:'')+'</button>'+(o.children||'')+'</li>';
  const folder='<span class="muted">'+I.folder+'</span>';
  let html='<div class="sec"><h4>Work</h4></div><ul class="nav">';
  html+=item({action:'filter-product',data:'data-value="all"',label:'All work',n:open.length,on:f.product==='all'&&f.group==='all',icon:folder});
  html+=item({action:'filter-group',data:'data-value="Product"',label:'Product work',n:cnt(t=>(KINDS[t.kind]||{}).group==='Product'),on:f.group==='Product',icon:folder});
  html+=item({action:'filter-group',data:'data-value="Client"',label:'Client work',n:cnt(t=>(KINDS[t.kind]||{}).group==='Client'),on:f.group==='Client',icon:folder});
  html+='</ul><div class="sec"><h4>Product lines</h4></div><ul class="nav">';
  Object.entries(PRODUCTS).forEach(([g,arr])=>{
    const isO=state.openGroups.has(g);
    const children=isO?'<ul class="sub">'+arr.map(p=>item({action:'filter-product',data:'data-value="'+esc(p)+'"',label:p,n:cnt(t=>t.product===p),on:f.product===p})).join('')+'</ul>':'';
    html+=item({action:'toggle-group',data:'data-value="'+g+'"',label:g,n:cnt(t=>arr.includes(t.product)),on:f.product===g,exp:isO,icon:folder,children});
  });
  html+='</ul><div class="sec"><h4>Status</h4></div><ul class="nav">';
  Object.entries(STATUS).forEach(([k,v])=>{ html+=item({action:'filter-status',data:'data-value="'+k+'"',label:v.label,n:all.filter(t=>t.status===k).length,on:f.status===k,icon:'<span class="dot '+k+'"></span>'}); });
  html+='</ul><div class="sec"><h4>Attention</h4></div><ul class="nav">';
  html+=item({action:'filter-status',data:'data-value="overdue"',label:'Overdue',n:all.filter(isOverdue).length,on:f.status==='overdue',icon:'<span class="dot ring" style="color:var(--todo)"></span>'});
  html+=item({action:'filter-status',data:'data-value="dueweek"',label:'Due in 7 days',n:all.filter(isDueWeek).length,on:f.status==='dueweek',icon:'<span class="dot ring" style="color:var(--review)"></span>'});
  html+=item({action:'filter-status',data:'data-value="blocked"',label:'Blocked',n:cnt(t=>!!t.blocked),on:f.status==='blocked',icon:'<span class="dot ring" style="color:var(--todo)"></span>'});
  html+=item({action:'filter-status',data:'data-value="waiting"',label:'Waiting on others',n:cnt(t=>waitingOn(t).length>0),on:f.status==='waiting',icon:'<span class="dot ring" style="color:var(--prog)"></span>'});
  html+='</ul><div class="sec"><h4>Team</h4>'+(state.readOnly?'':'<button type="button" data-action="team-open">'+I.edit+'Manage</button>')+'</div><ul class="nav team">';
  const owners=ownerList();
  html+= owners.length ? owners.map(o=>{ const n=cnt(t=>(t.owner||'').trim()===o), od=all.filter(t=>(t.owner||'').trim()===o&&isOverdue(t)).length; return '<li><button type="button" class="item" data-action="filter-owner" data-value="'+esc(o)+'" aria-pressed="'+(f.owner===o)+'">'+avatar(o)+'<div class="who"><b>'+esc(o)+'</b><span>'+n+' open'+(od?', '+od+' overdue':'')+'</span></div></button></li>'; }).join('') : '<li><p class="hint" style="padding:6px 10px;margin:0">Add your PMs under Manage so owners are picked from a list.</p></li>';
  html+='</ul>';
  $('#sideScroll').innerHTML=html;
}
function renderActiveFilters(){
  const f=state.filters, chips=[];
  const chip=(k,l)=>'<span class="af">'+esc(l)+'<button type="button" data-action="drop-filter" data-key="'+k+'" aria-label="Remove filter">'+I.x+'</button></span>';

  if (f.group!=='all') chips.push(chip('group',f.group+' work'));
  if (f.status!=='all') chips.push(chip('status','Status: '+({open:'Open',overdue:'Overdue',dueweek:'Due in 7 days',blocked:'Blocked',waiting:'Waiting on others'}[f.status]||(STATUS[f.status]||{}).label)));
  if (f.q) chips.push(chip('q','Search: '+f.q));
  const el=$('#activeFilters'); el.hidden=!chips.length; el.innerHTML=chips.length?'<span class="muted">Showing</span>'+chips.join('')+'<button type="button" class="clear" data-action="clear-filters">Clear all</button>':'';

function renderBanner(){
  const ex=[...state.tasks.values()].filter(t=>t.example);
  $('#banner').innerHTML = ex.length ? '<div class="banner"><span>The dashed <b>Example</b> tasks show how the board works. Edit one to keep it, or remove them all when your real tasks are in.</span><button type="button" class="btn sm" data-action="remove-examples">Remove '+ex.length+' example tasks</button></div>' : '';
}
function emptyState(){ return '<div class="empty"><h3>No tasks yet</h3><p>Add your team under Manage, then create the first task. Or load a few example tasks to see how the board works.</p><div class="btns"><button type="button" class="btn primary" data-action="new">New Task</button><button type="button" class="btn" data-action="load-examples">Load example tasks</button></div></div>'; }
function segsHTML(t){
  const p=subProgress(t);

}
function progHTML(t){ const p=subProgress(t); return p.total ? '<div class="prog">'+segsHTML(t)+'<span>'+p.done+'/'+p.total+'</span></div>' : '<div class="prog muted">No checklist</div>'; }
function tagChips(t, full){

    (t.product?'<span class="chip '+t.status+'">'+esc(t.product)+'</span>':'')+

    (t.example?'<span class="chip ex">Example</span>':'');

function badges(t){
  const due=dueInfo(t); let h='';

}
function cardHTML(t){
  const deps=depsOf(t), wait=waitingOn(t);
  return '<article class="card '+t.status+(state.drawerId===t.id?' sel':'')+'" data-id="'+esc(t.id)+'" '+(state.readOnly?'':'draggable="true"')+' data-action="open" tabindex="0">'+
    '<div class="card-top"><div class="chips">'+tagChips(t)+'</div><button type="button" class="icon-btn" data-action="menu" data-id="'+esc(t.id)+'" aria-label="Task menu" aria-expanded="'+(state.menuId===t.id)+'">'+I.dots+'</button></div>'+
    (state.menuId===t.id?'<div class="cmenu" role="menu"><button type="button" data-action="edit" data-id="'+esc(t.id)+'">'+I.edit+'Edit task</button>'+Object.entries(STATUS).filter(([s])=>s!==t.status).map(([s,v])=>'<button type="button" data-action="move" data-id="'+esc(t.id)+'" data-status="'+s+'"><span class="dot '+s+'"></span>Move to '+v.label+'</button>').join('')+'<button type="button" class="del" data-action="delete" data-id="'+esc(t.id)+'">'+I.trash+'Delete</button></div>':'')+
    '<h3>'+esc(t.title)+'</h3>'+(t.notes?'<p>'+esc(t.notes)+'</p>':'')+

/* ---------- Weekly report ---------- */
function reportData(){
  const ws=state.reportWeek, we=addDays(ws,6), weEnd=addDays(ws,7);
  const inWeek=iso=>{ if(!iso) return false; const d=new Date(iso); return !isNaN(d) && d>=ws && d<weEnd; };
  const tasks=filtered(true);
  const completed=tasks.filter(t=>t.status==='done' && inWeek(t.completedAt||t.updatedAt));
  const inprog=tasks.filter(t=>t.status==='in_progress'||t.status==='review');
  const late=tasks.filter(t=>isOpen(t) && ((parseD(t.end)&&parseD(t.end)<=we) || slipDays(t)>0 || isLateStart(t)));
  const blocked=tasks.filter(t=>t.blocked && t.status!=='done');
  const fresh=tasks.filter(t=>inWeek(t.createdAt));
  const backlog=tasks.filter(t=>t.status==='backlog');
  const nextWeek=tasks.filter(t=>isOpen(t) && parseD(t.end) && parseD(t.end)>we && parseD(t.end)<=addDays(we,7));
  const updatesFor=t=>t.updates.filter(u=>inWeek(u.at));
  return {ws,we,tasks,completed,inprog,late,blocked,fresh,backlog,nextWeek,updatesFor};
}

  $('#f-product').value=t.product||(f.product!=='all'&&!PRODUCTS[f.product]?f.product:'');

  fillOwnerSelect(t.owner||(f.owner!=='all'?f.owner:(state.team.length===1?state.team[0]:'')));
  const st=t.status||presetStatus||'todo'; $('#f-status').value=st; $('#f-priority').value=String(t.priority||2);
  $('#f-start').value=t.start||(st==='backlog'?'':toISO(today())); $('#f-end').value=t.end||(st==='backlog'?'':toISO(addDays(today(),14)));
  $('#f-notes').value=t.notes||'';
  $('#f-subtasks').innerHTML=''; (t.subtasks||[]).forEach(addSubRow); if(!(t.subtasks||[]).length) addSubRow();
  $('#f-depfilter').value=''; renderDepList(new Set(t.dependsOn||[]));
  if (typeof dlg.showModal==='function') dlg.showModal(); else dlg.setAttribute('open','');
  setTimeout(()=>$('#f-title').focus(),30);
}
function closeDialog(){ if (dlg.open) dlg.close(); else dlg.removeAttribute('open'); }
function addSubRow(s){
  const row=document.createElement('div'); row.className='sub-row'; const id=(s&&s.id)||uid('s_');
  row.innerHTML='<input type="checkbox" class="sub-done" aria-label="Done" '+(s&&s.done?'checked':'')+'><input class="sub-text" placeholder="Checklist item" value="'+esc(s?s.text:'')+'" data-sub="'+esc(id)+'"><button type="button" class="x" data-action="remove-subtask" aria-label="Remove item">'+I.x+'</button>';
  $('#f-subtasks').appendChild(row); return row;
}
function renderDepList(selected){
  const q=$('#f-depfilter').value.trim().toLowerCase(); const excluded=state.editingId?transitiveDependents(state.editingId):new Set();
  const opts=[...state.tasks.values()].filter(t=>t.id!==state.editingId&&!excluded.has(t.id)&&t.status!=='done').filter(t=>!q||(t.title+' '+(t.owner||'')).toLowerCase().includes(q)).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  const box=$('#f-deps');
  box.querySelectorAll('input:checked').forEach(i=>selected.add(i.value)); box.querySelectorAll('input:not(:checked)').forEach(i=>selected.delete(i.value));
  box.innerHTML=opts.length?opts.map(t=>'<label><input type="checkbox" name="dep" value="'+esc(t.id)+'" '+(selected.has(t.id)?'checked':'')+'><span class="dot '+t.status+'"></span><span>'+esc(t.title)+'</span><span class="muted small">'+esc(t.owner||'')+'</span><span class="when">'+esc(fmtD(t.end))+'</span></label>').join('')
    :'<p class="hint" style="margin:6px 4px">'+(state.tasks.size<=1?'Other tasks will show up here once you add them.':q?'No task matches that filter.':'No other open task can be a dependency here.')+'</p>';
}
function readForm(){
  const subs=[...$('#f-subtasks').querySelectorAll('.sub-row')].map(r=>({id:r.querySelector('.sub-text').dataset.sub,text:r.querySelector('.sub-text').value.trim(),done:r.querySelector('.sub-done').checked})).filter(s=>s.text);
  const deps=[...$('#f-deps').querySelectorAll('input:checked')].map(i=>i.value);
  const ownerSel=$('#f-owner').value; const owner = ownerSel==='__new' ? $('#f-ownerNew').value.trim() : ownerSel;
  return { title:$('#f-title').value.trim(), kind:$('#f-kind').value, product:$('#f-product').value, client:$('#f-client').value.trim(), owner, newOwner: ownerSel==='__new', status:$('#f-status').value, priority:Number($('#f-priority').value)||2, start:$('#f-start').value, end:$('#f-end').value, notes:$('#f-notes').value.trim(), subtasks:subs, dependsOn:deps };
}
function validate(v){
  if(!v.title) return 'Give the task a name.'; if(!v.owner) return 'Every task needs an owner.';
  if (v.status!=='backlog') { if(!parseD(v.start)) return 'Pick a start date, or put the task in Backlog.'; if(!parseD(v.end)) return 'Pick an end date, or put the task in Backlog.'; }
  if(parseD(v.start)&&parseD(v.end)&&parseD(v.end)<parseD(v.start)) return 'The end date is before the start date.'; return null;
}
form.addEventListener('submit', ev=>{
  ev.preventDefault(); const v=readForm(), err=validate(v); const errEl=$('#f-error');
  if (err) { errEl.textContent=err; errEl.hidden=false; return; }
  if (v.newOwner && v.owner && !state.team.includes(v.owner)) store.saveTeam(state.team.concat([v.owner]).sort());
  delete v.newOwner;
  const existing=state.editingId?state.tasks.get(state.editingId):null;
  const task=Object.assign({}, existing||{id:uid('t_'),createdAt:new Date().toISOString(),createdBy:state.uid||null,activity:[],updates:[]}, v); delete task.example;
  if (!existing || (existing.status==='backlog' && v.status!=='backlog')) task.endOriginal=v.end||null;
  closeDialog(); state.drawerId=task.id;
  store.save(task).then(()=>toast(existing?'Task updated':'Task created'));
});
form.addEventListener('keydown', ev=>{ if (ev.key==='Enter'&&ev.target.classList.contains('sub-text')) { ev.preventDefault(); addSubRow().querySelector('.sub-text').focus(); } });
$('#f-depfilter').addEventListener('input', ()=>renderDepList(new Set()));
$('#f-owner').addEventListener('change', ev=>{ const n=$('#f-ownerNew'); n.hidden = ev.target.value!=='__new'; if (!n.hidden) n.focus(); });
$('#f-status').addEventListener('change', ev=>{ $('#dateHint').textContent = ev.target.value==='backlog' ? 'Backlog items can stay undated until they are scheduled.' : 'Dates are required unless the task is in Backlog.'; });
dlg.addEventListener('close', ()=>{ state.editingId=null; });
dlg.addEventListener('click', ev=>{ if (ev.target===dlg) closeDialog(); });

/* ---------- Team dialog ---------- */
const tdlg=$('#teamDialog');
function renderTeam(){
  const all=[...state.tasks.values()];
  $('#teamList').innerHTML = state.team.length ? state.team.map(n=>'<li>'+avatar(n,'sm')+'<span>'+esc(n)+'</span><span class="n">'+all.filter(t=>t.owner===n&&isOpen(t)).length+' open</span><button type="button" class="icon-btn" data-action="team-remove" data-value="'+esc(n)+'" aria-label="Remove '+esc(n)+'">'+I.x+'</button></li>').join('') : '<li class="hint" style="border:0">No team members yet.</li>';
}
function openTeam(){ renderTeam(); if (typeof tdlg.showModal==='function') tdlg.showModal(); else tdlg.setAttribute('open',''); setTimeout(()=>$('#t-name').focus(),30); }
function closeTeam(){ if (tdlg.open) tdlg.close(); else tdlg.removeAttribute('open'); }
function teamAdd(){ const n=$('#t-name').value.trim(); if(!n) return; if (state.team.includes(n)) { toast(n+' is already on the team'); return; } store.saveTeam(state.team.concat([n]).sort()); $('#t-name').value=''; renderTeam(); }
$('#teamForm').addEventListener('submit', ev=>{ ev.preventDefault(); teamAdd(); });
tdlg.addEventListener('click', ev=>{ if (ev.target===tdlg) closeTeam(); });

/* ---------- Examples ---------- */
function sampleTasks(){
  const d=n=>toISO(addDays(today(),n)); const S=(text,done)=>({id:uid('s_'),text,done:!!done}); const now=new Date().toISOString();
  const a=uid('t_'),b=uid('t_'),c=uid('t_'),e=uid('t_'),f=uid('t_'),g=uid('t_'),h=uid('t_');
  const base={example:true,createdAt:now,updatedAt:now,activity:[],updates:[],blocked:null};
  return [
    Object.assign({},base,{id:a,title:'Nano AI: adaptive question bank v2',kind:'product-dev',product:'Nano AI',client:'',owner:'Asha Menon',status:'in_progress',priority:1,start:d(-10),end:d(18),endOriginal:d(18),notes:'Scope agreed with engineering. Item difficulty model needs a review before the beta cohort.',subtasks:[S('Write PRD and acceptance criteria',1),S('Review item difficulty model with data team',1),S('Build beta question bank (120 items)'),S('Run beta with two client cohorts'),S('Publish release notes')],dependsOn:[]}),
    Object.assign({},base,{id:b,title:'AI RolePlay: feedback report redesign',kind:'product-improve',product:'AI RolePlay',client:'',owner:'Rohan Iyer',status:'review',priority:2,start:d(-20),end:d(5),endOriginal:d(-2),notes:'Learners find the current report too long. Target: one page, three strengths, three gaps.',subtasks:[S('Collect feedback from 5 facilitators',1),S('Wireframe the one-page report',1),S('Usability test with 3 learners',1),S('Handover to design system team')],dependsOn:[]}),
    Object.assign({},base,{id:c,title:'Custom simulation for a banking client: leading through change',kind:'client-sim',product:'Simulations',client:'Banking client',owner:'Meera Shah',status:'todo',priority:1,start:d(-5),end:d(30),endOriginal:d(30),notes:'Needs the redesigned feedback report so the debrief format matches.',subtasks:[S('Discovery workshop with L&D head'),S('Draft scenario storyline'),S('Client sign-off on scenario'),S('Configure simulation in GenieKreator'),S('Pilot with 12 managers')],dependsOn:[b]}),
    Object.assign({},base,{id:e,title:'AI Koach cohort setup for a pharma client',kind:'client-coaching',product:'AI Koach',client:'Pharma client',owner:'Asha Menon',status:'todo',priority:2,start:d(3),end:d(25),endOriginal:d(25),notes:'',subtasks:[S('Map 6 coaching themes to competency framework'),S('Load 40 learner profiles'),S('Kick-off call with client sponsor')],dependsOn:[a]}),
    Object.assign({},base,{id:f,title:'PitchPerfect AI: scoring rubric review',kind:'product-other',product:'PitchPerfect AI',client:'',owner:'Rohan Iyer',status:'done',priority:2,start:d(-30),end:d(-3),endOriginal:d(-3),completedAt:new Date(Date.now()-2*DAY).toISOString(),notes:'Rubric v3 approved.',subtasks:[S('Benchmark against 20 recorded pitches',1),S('Calibrate with two sales trainers',1),S('Update rubric in product',1)],dependsOn:[]}),
    Object.assign({},base,{id:g,title:'Role-play scripts for a retail client onboarding',kind:'client-roleplay',product:'AI RolePlay',client:'Retail client',owner:'Meera Shah',status:'in_progress',priority:2,start:d(-12),end:d(-1),endOriginal:d(-1),notes:'Client asked for two extra scripts on returns handling.',blocked:{reason:'Waiting on client to confirm the returns policy wording',since:new Date(Date.now()-3*DAY).toISOString()},subtasks:[S('Write 4 store-floor scripts',1),S('Add 2 returns-handling scripts'),S('Client review')],dependsOn:[]}),
    Object.assign({},base,{id:h,title:'Conversation AI: Hindi language support',kind:'product-dev',product:'Conversation AI',client:'',owner:'Asha Menon',status:'backlog',priority:3,start:'',end:'',endOriginal:null,notes:'Requested by two enterprise accounts. Needs sizing.',subtasks:[],dependsOn:[]}),
  ];
}

/* ---------- Events ---------- */
function setFilter(k,v){ state.filters[k]= state.filters[k]===v && v!=='all' ? 'all' : v; if (k==='product'&&v!=='all') state.filters.group='all'; if (k==='group'&&v!=='all') state.filters.product='all'; state.sideOpen=false; if (state.view==='report' && k==='status') state.view='kanban'; render(); }
function moveTask(id, status){
  const t=state.tasks.get(id); if(!t||t.status===status) return;
  if (status!=='backlog' && !(parseD(t.start)&&parseD(t.end))) { openDialog(Object.assign({},t,{status}), status); toast('Add start and end dates to schedule this task.'); return; }
  const copy=Object.assign({},t,{status}); if (t.status==='backlog') copy.endOriginal=t.end;
  store.save(copy).then(()=>toast('Moved to '+STATUS[status].label));
}
document.addEventListener('click', ev=>{
  const btn=ev.target.closest('[data-action]');
  if (!ev.target.closest('.cmenu') && !ev.target.closest('[data-action="menu"]') && state.menuId) { state.menuId=null; render(); }
  if (!ev.target.closest('.filter-wrap') && state.filterOpen) { state.filterOpen=false; render(); }
  if (!btn) return;
  const a=btn.dataset.action, id=btn.dataset.id, v=btn.dataset.value;
  switch(a){
    case 'open': if (ev.target.closest('input,select,textarea,form,.cmenu,[data-action="menu"]')) return; state.drawerId=id; state.confirmDelete=false; state.blockForm=false; state.menuId=null; render(); break;
    case 'close-drawer': state.drawerId=null; state.confirmDelete=false; state.blockForm=false; render(); break;
    case 'close-overlays': state.drawerId=null; state.sideOpen=false; state.confirmDelete=false; state.blockForm=false; render(); break;
    case 'menu': ev.stopPropagation(); state.menuId=state.menuId===id?null:id; render(); break;
    case 'move': moveTask(id, btn.dataset.status); state.menuId=null; break;
    case 'new': if (state.readOnly) return toast('You have view-only access to this board.'); openDialog(null, btn.dataset.status); break;
    case 'edit': { const t=state.tasks.get(id); if (t) openDialog(t); break; }
    case 'close-dialog': closeDialog(); break;
    case 'add-subtask': addSubRow().querySelector('.sub-text').focus(); break;
    case 'remove-subtask': btn.closest('.sub-row').remove(); if (!$('#f-subtasks').children.length) addSubRow(); break;
    case 'delete': state.drawerId=id; state.confirmDelete=true; state.menuId=null; render(); break;
    case 'delete-cancel': state.confirmDelete=false; render(); break;
    case 'delete-confirm': state.confirmDelete=false; state.drawerId=null; store.remove(id).then(()=>toast('Task deleted')); break;
    case 'block': state.blockForm=true; render(); setTimeout(()=>{ const i=$('#blk-reason'); if(i) i.focus(); },30); break;
    case 'unblock': { const t=state.tasks.get(id); if (t) store.save(Object.assign({},t,{blocked:null})).then(()=>toast('Unblocked')); break; }
    case 'view': state.view=btn.dataset.view; lsSet('pmt.view',state.view); render(); break;
    case 'filter-owner': setFilter('owner',v); break;
    case 'filter-product': if (v==='all') { state.filters.product='all'; state.filters.group='all'; state.sideOpen=false; render(); } else setFilter('product',v); break;
    case 'filter-group': setFilter('group',v); break;
    case 'filter-status': setFilter('status',v); break;
    case 'toggle-group': if (state.openGroups.has(v)) state.openGroups.delete(v); else state.openGroups.add(v); lsSet('pmt.groups',[...state.openGroups]); render(); break;
    case 'drop-filter': state.filters[btn.dataset.key]= btn.dataset.key==='q'?'':'all'; render(); break;
    case 'clear-filters': state.filters={owner:'all',product:'all',group:'all',status:'all',q:''}; state.filterOpen=false; render(); break;
    case 'toggle-filter': state.filterOpen=!state.filterOpen; render(); break;
    case 'toggle-side': state.sideOpen=!state.sideOpen; render(); break;
    case 'toggle-archived': state.showArchived=!state.showArchived; render(); break;
    case 'week': { const dir=Number(btn.dataset.dir); state.reportWeek = dir===0 ? weekStart(today()) : addDays(state.reportWeek, 7*dir); render(); break; }
    case 'report-by': state.reportBy=v; render(); break;
    case 'copy-report': copyText(reportText(), 'Report copied. Paste it into your email or chat.'); break;
    case 'print-report': window.print(); break;
    case 'export-csv': exportCsv(); break;
    case 'team-open': openTeam(); break;
    case 'close-team': closeTeam(); break;
    case 'team-add': teamAdd(); break;
    case 'team-remove': store.saveTeam(state.team.filter(n=>n!==v)); renderTeam(); break;
    case 'load-examples': if (state.readOnly) return toast('You have view-only access to this board.'); { const ex=sampleTasks(); const names=[...new Set(ex.map(t=>t.owner))]; store.saveTeam([...new Set(state.team.concat(names))].sort()); ex.forEach(t=>store.save(t,{silent:true})); toast('Example tasks loaded'); } break;
    case 'remove-examples': [...state.tasks.values()].filter(t=>t.example).forEach(t=>{ if (state.drawerId===t.id) state.drawerId=null; store.remove(t.id); }); toast('Example tasks removed'); break;
  }
});
document.addEventListener('submit', ev=>{
  const f=ev.target.closest('form[data-action]'); if(!f) return; ev.preventDefault();
  const t=state.tasks.get(f.dataset.id); if(!t) return;
  if (f.dataset.action==='update-submit') { const txt=$('#upd-text').value.trim(); if(!txt) return; store.save(Object.assign({},t,{updates:t.updates.concat([{at:new Date().toISOString(), by: state.mode==='shared'?(state.uid||null):'local', text:txt}]).slice(-30)})).then(()=>toast('Update saved')); }
  if (f.dataset.action==='block-submit') { const r=$('#blk-reason').value.trim(); state.blockForm=false; store.save(Object.assign({},t,{blocked:{reason:r, since:new Date().toISOString()}})).then(()=>toast('Marked blocked')); }
});
document.addEventListener('keydown', ev=>{
  if (ev.key==='Escape' && (state.menuId||state.drawerId||state.sideOpen||state.filterOpen)) { state.menuId=null; state.drawerId=null; state.sideOpen=false; state.filterOpen=false; state.confirmDelete=false; state.blockForm=false; render(); }
  if (ev.key==='Enter' && ev.target.classList && ev.target.classList.contains('card')) { state.drawerId=ev.target.dataset.id; render(); }
});
document.addEventListener('change', ev=>{
  const el=ev.target.closest('[data-action]');
  if (el && el.dataset.action==='toggle-sub') { const t=state.tasks.get(el.dataset.id); if(!t) return; store.save(Object.assign({},t,{subtasks:t.subtasks.map(s=>s.id===el.dataset.sub?Object.assign({},s,{done:el.checked}):s)})); }
  else if (el && el.dataset.action==='set-status') moveTask(el.dataset.id, el.value);
  else if (ev.target.id==='f-groupFilter') { state.filters.group=ev.target.value; if (ev.target.value!=='all') state.filters.product='all'; render(); state.filterOpen=true; $('#filterPop').hidden=false; }
  else if (ev.target.id==='f-statusFilter') { state.filters.status=ev.target.value; if (state.view==='report') state.view='kanban'; render(); state.filterOpen=true; $('#filterPop').hidden=false; }
});
let searchTimer;
$('#f-search').addEventListener('input', ev=>{ clearTimeout(searchTimer); searchTimer=setTimeout(()=>{ state.filters.q=ev.target.value; render(); },120); });

/* Drag and drop */
document.addEventListener('dragstart', ev=>{ const c=ev.target.closest&&ev.target.closest('.card'); if(!c||state.readOnly) return; state.dragId=c.dataset.id; state.menuId=null; ev.dataTransfer.effectAllowed='move'; try{ ev.dataTransfer.setData('text/plain',c.dataset.id);}catch(e){} requestAnimationFrame(()=>c.classList.add('dragging')); });
document.addEventListener('dragend', ()=>{ document.querySelectorAll('.card.dragging').forEach(c=>c.classList.remove('dragging')); document.querySelectorAll('.col.over').forEach(c=>c.classList.remove('over')); state.dragId=null; });
document.addEventListener('dragover', ev=>{ const col=ev.target.closest&&ev.target.closest('.col'); if(!col||!state.dragId) return; ev.preventDefault(); ev.dataTransfer.dropEffect='move'; document.querySelectorAll('.col.over').forEach(c=>{ if(c!==col) c.classList.remove('over'); }); col.classList.add('over'); });
document.addEventListener('dragleave', ev=>{ const col=ev.target.closest&&ev.target.closest('.col'); if(col&&!col.contains(ev.relatedTarget)) col.classList.remove('over'); });
document.addEventListener('drop', ev=>{ const col=ev.target.closest&&ev.target.closest('.col'); if(!col) return; ev.preventDefault(); const id=state.dragId||(ev.dataTransfer&&ev.dataTransfer.getData('text/plain')); col.classList.remove('over'); if (id) moveTask(id, col.dataset.status); state.dragId=null; });

/* ---------- Boot ---------- */
fillSelects(); render(); store.init();
})();
</script>
