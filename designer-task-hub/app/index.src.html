<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one working column (max 1180px) under a sticky bar; views swap by role.
   Color follows the workbook's own section coding: navy = PM creates (1),
   teal = designer updates (2), grey = auto-calculated (3). */
:root {
  --bg: #f4f5f8;
  --surface: #ffffff;
  --surface-2: #eef0f5;
  --ink: #161a2e;
  --muted: #5b6179;
  --faint: #8a90a6;
  --line: #e1e4ec;
  --pm: #1f3864;
  --pm-soft: #e3e9f6;
  --des: #1f7a6d;
  --des-soft: #daf0ec;
  --auto: #6b7080;
  --focus: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --good-ink: #0a6e0a; --warn-ink: #8a5a00; --serious-ink: #a4461f; --critical-ink: #b12a2a;
  --good-bg: #e3f4e3; --warn-bg: #fdf1d6; --serious-bg: #fbe6dc; --critical-bg: #f9e0e0; --info-bg: #e2edfb; --info-ink: #1c5cab;
  --grid: #e7e6e2;
  --shadow: 0 1px 2px rgba(22, 26, 46, .06), 0 4px 14px rgba(22, 26, 46, .05);
  --font-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1120; --surface: #161a2b; --surface-2: #1d2236; --ink: #e9ebf3; --muted: #a3a9c0; --faint: #7a809a;
    --line: #2a3049; --pm: #9db4ea; --pm-soft: #1e2a4a; --des: #56c7b4; --des-soft: #15332f; --auto: #9aa0b4;
    --focus: #6da7ec; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --good-ink: #5fd35f; --warn-ink: #f5c451; --serious-ink: #f0a07f; --critical-ink: #f08a8a;
    --good-bg: #16301a; --warn-bg: #33290f; --serious-bg: #3a2218; --critical-bg: #3a1a1c; --info-bg: #182a45; --info-ink: #86b6ef;
    --grid: #2a3049; --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1120; --surface: #161a2b; --surface-2: #1d2236; --ink: #e9ebf3; --muted: #a3a9c0; --faint: #7a809a;
  --line: #2a3049; --pm: #9db4ea; --pm-soft: #1e2a4a; --des: #56c7b4; --des-soft: #15332f; --auto: #9aa0b4;
  --focus: #6da7ec; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --good-ink: #5fd35f; --warn-ink: #f5c451; --serious-ink: #f0a07f; --critical-ink: #f08a8a;
  --good-bg: #16301a; --warn-bg: #33290f; --serious-bg: #3a2218; --critical-bg: #3a1a1c; --info-bg: #182a45; --info-ink: #86b6ef;
  --grid: #2a3049; --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font: 15px/1.5 var(--font-body); margin: 0; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: .86em; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 650; letter-spacing: -.01em; text-wrap: balance; margin: 0; }
h1 { font-size: 1.7rem; line-height: 1.15; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1rem; }
.eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .86rem; }

/* Top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px 0; display: flex; flex-direction: column; gap: 8px; }
.bar-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; overflow: hidden; flex: none; }
.brand-mark i:nth-child(1) { background: var(--pm); } .brand-mark i:nth-child(2) { background: var(--des); }
.brand-mark i:nth-child(3) { background: var(--auto); } .brand-mark i:nth-child(4) { background: var(--surface-2); }
.brand b { font-family: var(--font-display); font-size: 1.1rem; font-weight: 650; }
.who { display: flex; align-items: center; gap: 8px; font-size: .9rem; min-width: 0; }
.who img { width: 26px; height: 26px; border-radius: 50%; }
.role { font-size: .74rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; letter-spacing: .03em; }
.role.pm { background: var(--pm-soft); color: var(--pm); }
.role.designer { background: var(--des-soft); color: var(--des); }
.role.admin { background: var(--surface-2); color: var(--ink); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 9px 12px 11px; font-weight: 600; font-size: .92rem; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tab .count { font-family: var(--font-mono); font-size: .75rem; margin-left: 6px; padding: 1px 6px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }

main { max-width: 1180px; margin: 0 auto; padding: 22px 16px 60px; display: flex; flex-direction: column; gap: 20px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.head p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 18px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.grid-half { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 860px) { .grid2, .grid-half { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .label { font-size: .8rem; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
input[type=text], input[type=number], input[type=date], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 11px; min-height: 40px;
}
textarea { resize: vertical; min-height: 64px; }
input:hover, select:hover, textarea:hover { border-color: color-mix(in srgb, var(--muted) 45%, var(--line)); }
input[type=range] { width: 100%; accent-color: var(--des); }
.err { color: var(--critical-ink); font-size: .82rem; font-weight: 600; }
.hint { color: var(--faint); font-size: .8rem; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 8px; font-weight: 650; cursor: pointer; min-height: 40px; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
.btn.pm { background: var(--pm); border-color: var(--pm); color: #fff; }
.btn.des { background: var(--des); border-color: var(--des); color: #fff; }
:root[data-theme="dark"] .btn.pm, :root[data-theme="dark"] .btn.des { color: #0e1120; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.pm, :root:not([data-theme="light"]) .btn.des { color: #0e1120; } }
.btn.ghost { border-color: transparent; background: none; padding: 6px 10px; min-height: 32px; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--critical-ink); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.sm { min-height: 32px; padding: 5px 11px; font-size: .86rem; }

/* Chips and pills */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; border-radius: 99px; font-size: .86rem; font-weight: 600; cursor: pointer; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--pm); border-color: var(--pm); color: var(--surface); }
.chip.des[aria-pressed="true"] { background: var(--des); border-color: var(--des); }
.group-label { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 6px 0 2px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: .76rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--pm-soft); color: var(--pm); white-space: nowrap; }
.tag.sub { background: var(--surface-2); color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .76rem; font-weight: 700; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--good-bg); color: var(--good-ink); }
.pill.warn { background: var(--warn-bg); color: var(--warn-ink); }
.pill.serious { background: var(--serious-bg); color: var(--serious-ink); }
.pill.critical { background: var(--critical-bg); color: var(--critical-ink); }
.pill.info { background: var(--info-bg); color: var(--info-ink); }
.pill.neutral { background: var(--surface-2); color: var(--muted); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; background: var(--surface-2); }
.seg button { border: 0; background: none; padding: 6px 11px; border-radius: 6px; font-size: .86rem; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* Lists and tables */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: left; font-size: .74rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: .84rem; }
.empty { text-align: center; padding: 36px 18px; color: var(--muted); }
.empty h3 { color: var(--ink); margin-bottom: 4px; }

/* Task card (designer) */
.task { display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; border-left: 4px solid var(--des); }
.task.overdue { border-left-color: var(--critical); }
.task.blocked { border-left-color: var(--warn); }
.task-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.task-title { font-weight: 700; font-size: 1.02rem; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: .86rem; }
.progress { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--des); border-radius: 99px; }
.update { background: var(--surface-2); border-radius: 9px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.update .fields { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.stepper button { border: 0; background: none; width: 36px; height: 38px; cursor: pointer; font-size: 1.1rem; }
.stepper span { min-width: 30px; text-align: center; font-family: var(--font-mono); }
.history { font-size: .84rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.history b { color: var(--ink); font-weight: 600; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; }
.kpi .v { font-family: var(--font-display); font-size: 1.9rem; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: .78rem; color: var(--muted); font-weight: 600; }

/* Charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 12px; font-family: var(--font-body); }
.chart .lbl { fill: var(--ink); font-weight: 600; }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .82rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.bar-cell { display: flex; align-items: center; gap: 8px; min-width: 110px; }
.bar-cell .track { flex: 1; height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar-cell .track i { display: block; height: 100%; border-radius: 99px; background: var(--s1); }
.heat { display: grid; gap: 4px; }
.heat .cell { border-radius: 6px; padding: 6px 4px; text-align: center; font-family: var(--font-mono); font-size: .76rem; line-height: 1.2; min-width: 0; }
.heat .hd { font-size: .72rem; color: var(--muted); text-align: center; font-weight: 600; }
.heat .nm { font-weight: 600; font-size: .86rem; align-self: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); font-size: .8rem; padding: 6px 9px; border-radius: 7px; max-width: 260px; box-shadow: var(--shadow); white-space: pre-line; }

/* Availability */
.avail { display: flex; flex-direction: column; gap: 10px; }
.avail-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; cursor: pointer; background: var(--surface); text-align: left; }
.avail-row[aria-pressed="true"] { border-color: var(--pm); box-shadow: 0 0 0 1px var(--pm) inset; }
.avail-row .util { grid-column: 1 / -1; display: grid; grid-template-columns: 64px minmax(0, 1fr) 48px; gap: 8px; align-items: center; font-size: .78rem; color: var(--muted); }
.avail-row .util .track { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.avail-row .util .track i { display: block; height: 100%; border-radius: 99px; }
.preview { font-family: var(--font-mono); font-size: .82rem; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; overflow-wrap: anywhere; }
.preview .k { color: var(--faint); }
.section-note { display: flex; gap: 10px; align-items: center; font-size: .82rem; color: var(--muted); }
.section-note b { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; color: #fff; font-size: .72rem; flex: none; }
.banner { padding: 12px 16px; border-radius: var(--r); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.banner.info { background: var(--info-bg); color: var(--info-ink); }
.banner.warn { background: var(--warn-bg); color: var(--warn-ink); }
.banner.good { background: var(--good-bg); color: var(--good-ink); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 9px; font-weight: 600; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.list-edit { display: flex; flex-direction: column; gap: 6px; }
.list-edit .li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
.list-edit .li.two { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) auto; }
details > summary { cursor: pointer; font-weight: 600; color: var(--muted); list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "+ "; font-family: var(--font-mono); }
details[open] > summary::before { content: "- "; }
.avatar { width: 32px; height: 32px; border-radius: 50%; flex: none; }
.skeleton { color: var(--faint); padding: 40px 0; text-align: center; }
@media (prefers-reduced-motion: no-preference) { .fade { animation: fade .25s ease both; } @keyframes fade { from { opacity: .4; transform: translateY(3px); } } }
</style>

async function pickTemplate(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  try {
    const bytes = new Uint8Array(await file.arrayBuffer());
    const zip = await JSZip.loadAsync(bytes);
    const need = ["xl/tables/table1.xml", "xl/worksheets/sheet5.xml", "xl/worksheets/sheet6.xml", "xl/worksheets/sheet7.xml", "xl/charts/chart1.xml"];
    const t1 = zip.file("xl/tables/table1.xml") ? await zip.file("xl/tables/table1.xml").async("string") : "";
    if (need.some((n) => !zip.file(n)) || !/name="tblTasks"/.test(t1)) throw new Error("shape");
    S.template = { name: file.name, bytes };
    S.exportMsg = { kind: "good", text: `"${file.name}" will be used as the template. Its task, leave and log rows are replaced by the app's data.` };
  } catch (err) {
    S.template = null;
    S.exportMsg = { kind: "warn", text: "That file doesn't look like a Design Task Hub export, so the built-in template stays in use." };
  }
  render();
}
function b64ToBytes(b64) { const s = atob(b64); const out = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i); return out; }

    const tpl = S.template ? S.template.bytes : b64ToBytes(window.DTH_TEMPLATE_B64);
    const { bytes, warnings } = await X.build({ JSZip, DOMParser, XMLSerializer }, tpl,
      { config: cfg(), tasks, leave, period: { from: o.from, to: o.to }, designerCopy: o.designerCopy });
    const name = `Product Designer Task Manager ${today()}${o.designerCopy ? " (designer copy)" : ""}.xlsx`;
    await downloads.save({ filename: name, data: new Blob([bytes]) });

  } catch (e) {

const tip = document.getElementById("tip");
document.addEventListener("mousemove", (e) => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (!t) { tip.hidden = true; return; }
  tip.textContent = t.getAttribute("data-tip");
  tip.hidden = false;
  const x = Math.min(window.innerWidth - tip.offsetWidth - 8, e.clientX + 14), y = Math.min(window.innerHeight - tip.offsetHeight - 8, e.clientY + 14);
  tip.style.left = x + "px"; tip.style.top = y + "px";
});

// ------------------------------------------------------------------- boot
async function boot() {

  userApi = u; db = d; downloads = dl;
  if (u) {
    const me = await u.me();
    S.me = { id: me.id, name: me.name, avatarUrl: me.avatarUrl, isOwner: me.isOwner };
  }
  if (!db) { S.noDb = true; S.ready = true; S.config = null; return render(); }
  let pending = 3;
  const done = () => { if (--pending <= 0 && !S.ready) { S.ready = true; } render(); };
  const onErr = (e) => { console.error(e); if (!S.ready) { S.ready = true; } render(); };
  db.doc("config/main").onSnapshot((s) => { S.config = s.exists ? normalizeConfig(s.data()) : null; if (!S.cfgDraft) {} done(); }, onErr);
  db.doc("config/people").onSnapshot((s) => { S.people = s.exists && s.data().map ? s.data().map : {}; done(); }, onErr);
  db.collection("tasks").onSnapshot((q) => { S.tasks = q.docs.map((x) => ({ id: x.id, ...x.data() })); done(); }, onErr);
  db.collection("leave").onSnapshot((q) => { S.leave = q.docs.map((x) => ({ id: x.id, ...x.data() })); render(); }, onErr);
  db.collection("checkins").onSnapshot((q) => { const m = {}; q.docs.forEach((x) => { m[x.id] = x.data(); }); S.checkins = m; render(); }, onErr);
