<title>Design Task Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a frosted-glass app window floating on a soft KNOLSKAPE gradient.
   Wide screens: sidebar + top bar + content. Tablet: icon rail. Phone: full
   bleed with a bottom dock. Three interfaces (#pm, #designer, #owner) share
   this shell; each tints its hero and active navigation with its own brand
   colour (PM = Science Blue, Designer = Orange, Owner = Gold on Ebony).
   Type: Plus Jakarta Sans throughout, JetBrains Mono for IDs and figures. */
:root {
  /* KNOLSKAPE brand */
  --ks-blue: #0337D8; --ks-ebony: #111827; --ks-gold: #FBD300; --ks-orange: #FF7103;
  --ks-flamingo: #E85C24; --ks-red: #C12400; --ks-green: #C2D02F; --ks-porcelain: #E2E9E9; --ks-periwinkle: #9FB6F2;
  --rainbow: linear-gradient(90deg, #FBD300, #FF7103 25%, #0337D8 50%, #C2D02F 75%, #C12400);
  --warm: linear-gradient(90deg, #FBD300, #FF7103);

  /* surfaces */
  --bg: #EEF1F8;
  --bg-a: #DCE5FF; --bg-b: #EEF0FA; --bg-c: #ECE6FB; --bg-d: #FFF1E2;
  --glow-1: rgba(3, 55, 216, .22); --glow-2: rgba(159, 182, 242, .55); --glow-3: rgba(251, 211, 0, .28);
  --glass: rgba(255, 255, 255, .58);
  --glass-strong: rgba(255, 255, 255, .86);
  --glass-soft: rgba(255, 255, 255, .42);
  --glass-line: rgba(255, 255, 255, .8);
  --surface: #ffffff;
  --surface-2: #F1F4F8;
  --line: #D5DBE3;
  --line-soft: rgba(17, 24, 39, .07);
  --ink: #111827; --body: #242424; --muted: #474747; --faint: #6B7280;
  --accent: var(--ks-blue); --accent-ink: #0337D8; --accent-soft: rgba(3, 55, 216, .09); --on-accent: #fff;
  --focus: #0337D8;
  --btn-a: #2458F0; --btn-b: #0337D8;
  /* chart series (validated order, light) */
  --s1: #0337D8; --s2: #E86A00; --s3: #7E9CF0; --s4: #C12400; --s5: #8A9A1A;
  /* status */
  --good: #5E8C00; --warn: #E0B800; --serious: #E85C24; --critical: #C12400;
  --good-ink: #3F6200; --warn-ink: #7A5B00; --serious-ink: #A8400F; --critical-ink: #B02100;
  --good-bg: rgba(194, 208, 47, .22); --warn-bg: rgba(251, 211, 0, .22); --serious-bg: rgba(232, 92, 36, .13); --critical-bg: rgba(193, 36, 0, .11);
  --info-bg: rgba(3, 55, 216, .09); --info-ink: #0337D8;
  --grid: rgba(17, 24, 39, .08);
  --shadow: 0 1px 2px rgba(17, 24, 39, .04), 0 8px 28px rgba(17, 24, 39, .06);
  --shadow-lg: 0 30px 80px rgba(17, 24, 39, .12);
  --font-display: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-body: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r-lg: 22px; --r: 16px; --r-sm: 11px;
  --side-w: 244px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0F1E; --bg-a: #0B1224; --bg-b: #0E1428; --bg-c: #131230; --bg-d: #1A1410;
    --glow-1: rgba(3, 55, 216, .45); --glow-2: rgba(111, 143, 255, .22); --glow-3: rgba(255, 113, 3, .16);
    --glass: rgba(20, 26, 44, .62); --glass-strong: rgba(24, 31, 52, .88); --glass-soft: rgba(24, 31, 52, .45); --glass-line: rgba(255, 255, 255, .08);
    --surface: #161C30; --surface-2: #1D2440; --line: #2A3350; --line-soft: rgba(255, 255, 255, .06);
    --ink: #F3F5FA; --body: #E2E6F0; --muted: #C9D2E2; --faint: #ADB8C8;
    --accent: #6F8FFF; --accent-ink: #9FB6F2; --accent-soft: rgba(111, 143, 255, .16); --on-accent: #fff; --focus: #9FB6F2;
    --btn-a: #3F6FFF; --btn-b: #1F4CE8;
    --s1: #3F6FFF; --s2: #D9620A; --s3: #7088F5; --s4: #B8301F; --s5: #8A980C;
    --good-ink: #CFE07A; --warn-ink: #FBE27A; --serious-ink: #F7A27E; --critical-ink: #FF9A82;
    --good-bg: rgba(194, 208, 47, .16); --warn-bg: rgba(251, 211, 0, .14); --serious-bg: rgba(232, 92, 36, .18); --critical-bg: rgba(193, 36, 0, .24);
    --info-bg: rgba(111, 143, 255, .16); --info-ink: #9FB6F2;
    --grid: rgba(255, 255, 255, .08);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .25); --shadow-lg: 0 30px 80px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0F1E; --bg-a: #0B1224; --bg-b: #0E1428; --bg-c: #131230; --bg-d: #1A1410;
  --glow-1: rgba(3, 55, 216, .45); --glow-2: rgba(111, 143, 255, .22); --glow-3: rgba(255, 113, 3, .16);
  --glass: rgba(20, 26, 44, .62); --glass-strong: rgba(24, 31, 52, .88); --glass-soft: rgba(24, 31, 52, .45); --glass-line: rgba(255, 255, 255, .08);
  --surface: #161C30; --surface-2: #1D2440; --line: #2A3350; --line-soft: rgba(255, 255, 255, .06);
  --ink: #F3F5FA; --body: #E2E6F0; --muted: #C9D2E2; --faint: #ADB8C8;
  --accent: #6F8FFF; --accent-ink: #9FB6F2; --accent-soft: rgba(111, 143, 255, .16); --on-accent: #fff; --focus: #9FB6F2;
  --btn-a: #3F6FFF; --btn-b: #1F4CE8;
  --s1: #3F6FFF; --s2: #D9620A; --s3: #7088F5; --s4: #B8301F; --s5: #8A980C;
  --good-ink: #CFE07A; --warn-ink: #FBE27A; --serious-ink: #F7A27E; --critical-ink: #FF9A82;
  --good-bg: rgba(194, 208, 47, .16); --warn-bg: rgba(251, 211, 0, .14); --serious-bg: rgba(232, 92, 36, .18); --critical-bg: rgba(193, 36, 0, .24);
  --info-bg: rgba(111, 143, 255, .16); --info-ink: #9FB6F2;
  --grid: rgba(255, 255, 255, .08);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .25); --shadow-lg: 0 30px 80px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
/* interface identity */
body[data-app="pm"] { --id: var(--ks-blue); --id-soft: rgba(3, 55, 216, .12); --hero: linear-gradient(115deg, rgba(3, 55, 216, .20), rgba(159, 182, 242, .45) 42%, rgba(194, 208, 47, .30) 78%, rgba(251, 211, 0, .22)); }
body[data-app="designer"] { --id: var(--ks-orange); --id-soft: rgba(255, 113, 3, .14); --hero: linear-gradient(115deg, rgba(255, 113, 3, .22), rgba(251, 211, 0, .30) 38%, rgba(159, 182, 242, .42) 78%, rgba(3, 55, 216, .16)); }
body[data-app="owner"] { --id: var(--ks-gold); --id-soft: rgba(251, 211, 0, .2); --hero: linear-gradient(115deg, rgba(17, 24, 39, .10), rgba(3, 55, 216, .20) 35%, rgba(159, 182, 242, .40) 65%, rgba(251, 211, 0, .30)); }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) body[data-app="pm"] { --hero: linear-gradient(115deg, rgba(3, 55, 216, .55), rgba(63, 111, 255, .22) 45%, rgba(20, 26, 44, .2) 80%); }
  :root:not([data-theme="light"]) body[data-app="designer"] { --hero: linear-gradient(115deg, rgba(255, 113, 3, .38), rgba(232, 92, 36, .16) 45%, rgba(3, 55, 216, .22) 90%); }
  :root:not([data-theme="light"]) body[data-app="owner"] { --hero: linear-gradient(115deg, rgba(3, 55, 216, .45), rgba(111, 143, 255, .16) 50%, rgba(251, 211, 0, .12) 95%); }
}
:root[data-theme="dark"] body[data-app="pm"] { --hero: linear-gradient(115deg, rgba(3, 55, 216, .55), rgba(63, 111, 255, .22) 45%, rgba(20, 26, 44, .2) 80%); }
:root[data-theme="dark"] body[data-app="designer"] { --hero: linear-gradient(115deg, rgba(255, 113, 3, .38), rgba(232, 92, 36, .16) 45%, rgba(3, 55, 216, .22) 90%); }
:root[data-theme="dark"] body[data-app="owner"] { --hero: linear-gradient(115deg, rgba(3, 55, 216, .45), rgba(111, 143, 255, .16) 50%, rgba(251, 211, 0, .12) 95%); }
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--body); }
body { margin: 0; font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; min-height: 100vh; }
body::before { content: ""; position: fixed; inset: 0 0 auto 0; height: 3px; background: var(--rainbow); z-index: 40; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: .84em; }
h1, h2, h3 { color: var(--ink); margin: 0; text-wrap: balance; }
h1 { font: 700 1.95rem/1.15 var(--font-display); letter-spacing: -.025em; }
h2 { font: 700 1.2rem/1.25 var(--font-display); letter-spacing: -.015em; }
h3 { font-size: 1rem; font-weight: 700; }
.eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
[hidden] { display: none !important; }

/* ---- background */
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: linear-gradient(135deg, var(--bg-a), var(--bg-b) 38%, var(--bg-c) 68%, var(--bg-d)); }
.bg i { position: absolute; border-radius: 50%; filter: blur(90px); }
.bg .g1 { width: 46vw; height: 46vw; left: -12vw; top: -14vw; background: var(--glow-1); }
.bg .g2 { width: 40vw; height: 40vw; right: -10vw; top: 18vh; background: var(--glow-2); }
.bg .g3 { width: 34vw; height: 34vw; left: 30vw; bottom: -18vw; background: var(--glow-3); }

/* ---- app window */
.shell { max-width: 1480px; margin: 20px auto; min-height: calc(100vh - 40px); display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr);
  background: var(--glass); border: 1px solid var(--glass-line); border-radius: 28px; box-shadow: var(--shadow-lg);
  backdrop-filter: blur(26px) saturate(1.5); -webkit-backdrop-filter: blur(26px) saturate(1.5); }
.side { position: sticky; top: 20px; align-self: start; height: calc(100vh - 40px); display: flex; flex-direction: column; gap: 18px; padding: 22px 14px 16px;
  border-right: 1px solid var(--line-soft); overflow-y: auto; }
.side-brand { padding: 2px 10px 6px; display: flex; flex-direction: column; gap: 14px; }
.logo { height: 20px; width: auto; display: block; }
.logo.white { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo.dark { display: none; } :root:not([data-theme="light"]) .logo.white { display: block; } }
:root[data-theme="dark"] .logo.dark { display: none; }
:root[data-theme="dark"] .logo.white { display: block; }
.app-id { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--glass-strong); border: 1px solid var(--glass-line); box-shadow: var(--shadow); }
.app-id .mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; flex: none; background: var(--id); box-shadow: inset 0 -8px 16px rgba(0, 0, 0, .12); }
body[data-app="owner"] .app-id .mark { background: var(--ks-ebony); color: var(--ks-gold); }
.app-id .mark svg { width: 18px; height: 18px; }
.app-id small { display: block; font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
.app-id b { display: block; font-size: .95rem; color: var(--ink); line-height: 1.2; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-group { font-size: .72rem; color: var(--faint); font-weight: 600; padding: 12px 12px 4px; }
.tab { display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: none; text-align: left; padding: 9px 12px; border-radius: 12px; color: var(--muted); font-weight: 600; font-size: .92rem; cursor: pointer; position: relative; }
.tab svg { width: 18px; height: 18px; flex: none; opacity: .8; }
.tab:hover { background: var(--glass-soft); color: var(--ink); }
.tab[aria-selected="true"] { background: var(--glass-strong); color: var(--ink); box-shadow: var(--shadow); }
.tab[aria-selected="true"]::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--id); }
.tab[aria-selected="true"] svg { opacity: 1; color: var(--accent-ink); }
.tab .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.count { font-family: var(--font-mono); font-size: .7rem; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--btn-b); color: #fff; display: inline-grid; place-items: center; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.side-foot .warmline { height: 3px; border-radius: 3px; background: var(--warm); width: 56px; margin-left: 12px; }
.me { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; }
.me img, .me .ini, .avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; object-fit: cover; background: var(--surface-2); }
.me b { display: block; font-size: .88rem; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me small { color: var(--faint); font-size: .76rem; }
.col { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 20px; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 16px 28px; border-bottom: 1px solid var(--line-soft);
  background: var(--glass-soft); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top-right-radius: 28px; }
.crumb { display: flex; align-items: baseline; gap: 8px; min-width: 0; margin-right: auto; }
.crumb b { font-size: 1rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb span { color: var(--faint); font-size: .88rem; white-space: nowrap; }
.crumb .mlogo { display: none !important; }
@media (max-width: 760px) {
  .crumb .mlogo.mdark { display: block !important; height: 16px; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .crumb .mlogo.mdark { display: none !important; } :root:not([data-theme="light"]) .crumb .mlogo.mwhite { display: block !important; height: 16px; } }
  :root[data-theme="dark"] .crumb .mlogo.mdark { display: none !important; }
  :root[data-theme="dark"] .crumb .mlogo.mwhite { display: block !important; height: 16px; }
}
.search { position: relative; width: min(340px, 36vw); }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--faint); pointer-events: none; }
.top .search input { width: 100%; height: 40px; border-radius: 99px; border: 1px solid var(--glass-line); background: var(--glass-strong); padding: 0 14px 0 38px; box-shadow: inset 0 1px 2px rgba(17, 24, 39, .04); }
.icon-btn { position: relative; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--glass-line); background: var(--glass-strong); display: grid; place-items: center; cursor: pointer; color: var(--muted); flex: none; }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn .count { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; font-size: .64rem; border: 2px solid var(--glass-strong); }
.me .ini, .avatar.ini, .me-mini.ini { background: linear-gradient(145deg, #7E9CF0, #0337D8); color: #fff; }
.ini { display: inline-grid; place-items: center; font-weight: 700; font-size: .8rem; color: #fff; background: linear-gradient(145deg, #7E9CF0, #0337D8); border-radius: 50%; }
.top .me-mini { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--glass-strong); box-shadow: var(--shadow); flex: none; }
main { padding: 26px 28px 60px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.dock { display: none; }

/* ---- responsive */
@media (max-width: 1180px) {
  .shell { --side-w: 76px; }
  .side { padding: 20px 10px; align-items: center; }
  .side-brand { padding: 0; align-items: center; }
  .logo, .app-id div, .nav-group, .tab .label, .me div, .side-foot .warmline { display: none !important; }
  .app-id { padding: 8px; }
  .tab { justify-content: center; padding: 11px; width: 52px; }
  .tab .count { position: absolute; top: 2px; right: 2px; min-width: 16px; height: 16px; font-size: .6rem; padding: 0 4px; }
  .me { padding: 0; justify-content: center; }
}
@media (max-width: 760px) {
  .shell { margin: 0; border-radius: 0; border: 0; min-height: 100vh; display: block; background: transparent; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
  .side { display: none; }
  .top { top: 0; border-radius: 0; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; flex-wrap: wrap; background: var(--glass); }
  .crumb span { display: none; }
  .crumb { flex: 1; }
  .crumb b { font-size: .95rem; }
  .top .me-mini, .top .icon-btn { width: 36px; height: 36px; }
  .search { order: 5; width: 100%; }
  main { padding: 18px 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
  h1 { font-size: 1.6rem; }
  .dock { display: flex; position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 30; gap: 2px; padding: 6px;
    border-radius: 22px; background: var(--glass-strong); border: 1px solid var(--glass-line); box-shadow: var(--shadow-lg);
    backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4); overflow-x: auto; scrollbar-width: none; }
  .dock::-webkit-scrollbar { display: none; }
  .dock button { flex: 1 0 64px; border: 0; background: none; border-radius: 16px; padding: 7px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .66rem; font-weight: 600; color: var(--faint); position: relative; cursor: pointer; }
  .dock button svg { width: 20px; height: 20px; }
  .dock button[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); }
  .dock .count { position: absolute; top: 2px; right: calc(50% - 20px); min-width: 16px; height: 16px; font-size: .6rem; padding: 0 4px; }
}

/* ---- page header and hero */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.head p { margin: 6px 0 0; color: var(--muted); max-width: 64ch; }
.hero { position: relative; overflow: hidden; border-radius: var(--r-lg); padding: 28px 30px; background: var(--hero), var(--glass-strong); border: 1px solid var(--glass-line); box-shadow: var(--shadow); isolation: isolate; }
.hero::after { content: ""; position: absolute; left: 30px; bottom: 0; width: 120px; height: 3px; border-radius: 3px 3px 0 0; background: var(--rainbow); }
.hero-body { position: relative; z-index: 2; max-width: 62%; display: flex; flex-direction: column; gap: 10px; }
.hero h1 { font-size: 2.15rem; font-weight: 800; letter-spacing: -.03em; }
.hero p { margin: 0; color: var(--muted); max-width: 56ch; }
.hero-stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.hero-stat { padding: 10px 14px; border-radius: 14px; background: var(--glass-strong); border: 1px solid var(--glass-line); min-width: 104px; }
.hero-stat .v { font: 700 1.5rem/1.1 var(--font-body); color: var(--ink); font-variant-numeric: tabular-nums; }
.hero-stat .l { font-size: .74rem; color: var(--muted); font-weight: 600; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.shapes { position: absolute; right: 0; top: 0; bottom: 0; width: 42%; z-index: 1; pointer-events: none; }
.shape { position: absolute; }
.torus { width: 200px; height: 200px; right: 6%; top: 50%; margin-top: -86px; border-radius: 50%;
  background: radial-gradient(circle at 36% 30%, #C9D6FF 0 8%, #7E9CF0 22%, #0337D8 58%, #021C74 100%);
  -webkit-mask: radial-gradient(circle, transparent 29%, #000 30.5%); mask: radial-gradient(circle, transparent 29%, #000 30.5%);
  transform: rotate(-24deg) scaleY(.78); filter: drop-shadow(0 18px 28px rgba(3, 55, 216, .35)); }
.sphere { width: 46px; height: 46px; border-radius: 50%; right: 44%; top: 16%; background: radial-gradient(circle at 32% 28%, #FFF7B8, #FBD300 45%, #C79A00); box-shadow: 0 10px 20px rgba(199, 154, 0, .3); }
.cube { width: 38px; height: 38px; border-radius: 9px; right: 16%; top: 12%; background: linear-gradient(145deg, #FFB070, #FF7103 55%, #D24E00); transform: rotate(24deg); box-shadow: 0 10px 18px rgba(255, 113, 3, .3); }
.cone { width: 0; height: 0; right: 40%; bottom: 14%; border-left: 22px solid transparent; border-right: 22px solid transparent; border-bottom: 40px solid #E85C24; transform: rotate(-28deg); filter: drop-shadow(0 8px 10px rgba(193, 36, 0, .3)); }
.pill-shape { width: 70px; height: 22px; border-radius: 99px; right: 30%; top: 70%; background: linear-gradient(90deg, #C2D02F, #8A9A1A); transform: rotate(-18deg); opacity: .9; }
@media (prefers-reduced-motion: no-preference) {
  .torus { animation: float 9s ease-in-out infinite; }

/* ---- designer task card */
.task { display: flex; flex-direction: column; gap: 14px; padding: 18px 20px; }

.item { display: grid; grid-template-columns: 30px minmax(120px, 1.4fr) minmax(128px, .8fr) auto minmax(140px, 1fr); gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line-soft); }
