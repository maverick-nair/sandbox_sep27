<title>Design Task Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a solid brand top bar across the page, an icon rail on the left
   (icon over a short label), and a light content area of white cards on a
   soft lavender background. Phone: full bleed with a bottom dock. Three
   interfaces (#pm, #designer, #owner) share this shell.
   Type: Plus Jakarta Sans throughout, JetBrains Mono for IDs and figures. */
:root {
  /* brand */
  --brand: #6A35BE; --brand-deep: #5B2AA8; --brand-top: #6A35BE; --brand-active: rgba(255, 255, 255, .18);
  --on-brand: #fff; --on-brand-muted: rgba(255, 255, 255, .74);
  --ks-orange: #F59E0B; --ks-ebony: #1F1B2E; --ks-red: #D14343;
  /* surfaces */
  --bg: #F4F3FA;
  --surface: #ffffff; --surface-2: #F5F3FB;
  --line: #DCD8EA; --line-soft: #ECE9F4;
  --glass: var(--surface); --glass-strong: var(--surface); --glass-soft: var(--surface-2); --glass-line: var(--line-soft);
  --ink: #1F1B2E; --body: #2B2740; --muted: #5C5872; --faint: #8A879C;
  --accent: #6A35BE; --accent-ink: #5B2AA8; --accent-soft: #EFEAFB; --on-accent: #fff;
  --focus: #6A35BE;
  --btn-a: #7440CC; --btn-b: #6A35BE;
  /* chart series: purple, orange, lavender, red, olive */
  --s1: #6C4BD6; --s2: #F59E0B; --s3: #B9A7EE; --s4: #D14343; --s5: #7C8A1C;
  /* status */
  --good: #3E9C5B; --warn: #E0B800; --serious: #E8742A; --critical: #D14343;
  --good-ink: #256E3B; --warn-ink: #7A5B00; --serious-ink: #A8400F; --critical-ink: #B03030;
  --good-bg: rgba(62, 156, 91, .14); --warn-bg: rgba(224, 184, 0, .18); --serious-bg: rgba(232, 116, 42, .13); --critical-bg: rgba(209, 67, 67, .11);
  --info-bg: #EFEAFB; --info-ink: #5B2AA8;
  --grid: rgba(31, 27, 46, .08);
  --shadow: 0 1px 2px rgba(31, 27, 46, .04), 0 2px 10px rgba(31, 27, 46, .05);
  --shadow-lg: 0 24px 60px rgba(31, 27, 46, .16);
  --font-display: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-body: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r-lg: 14px; --r: 12px; --r-sm: 8px;
  /* one spacing scale for every interface */
  --page-x: 20px;       /* page edge */
  --section: 16px;      /* between cards on a page */
  --card-pad: 20px;     /* inside cards */
  --inner: 14px;        /* panels inside cards */
  --stack: 14px;        /* between items inside a card */
  --side-w: 84px; --top-h: 56px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand: #4B2A8A; --brand-deep: #241A44; --brand-top: #2E2058; --brand-active: rgba(255, 255, 255, .14);
    --bg: #100E1C; --surface: #191529; --surface-2: #221D38; --line: #332C4F; --line-soft: #2A2442;
    --ink: #F3F1FA; --body: #E1DDF0; --muted: #B9B3D0; --faint: #8F89A8;
    --accent: #A78BFA; --accent-ink: #C4B5FD; --accent-soft: rgba(167, 139, 250, .16); --focus: #C4B5FD;
    --btn-a: #7C4DDB; --btn-b: #6A35BE;
    --s1: #9B7BFF; --s2: #F5A623; --s3: #6F5FB0; --s4: #E06060; --s5: #A3B33A;
    --good-ink: #8FD6A4; --warn-ink: #FBE27A; --serious-ink: #F7A27E; --critical-ink: #FF9A9A;
    --good-bg: rgba(62, 156, 91, .18); --warn-bg: rgba(224, 184, 0, .14); --serious-bg: rgba(232, 116, 42, .18); --critical-bg: rgba(209, 67, 67, .22);
    --info-bg: rgba(167, 139, 250, .16); --info-ink: #C4B5FD;
    --grid: rgba(255, 255, 255, .08);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 2px 10px rgba(0, 0, 0, .25); --shadow-lg: 0 24px 60px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand: #4B2A8A; --brand-deep: #241A44; --brand-top: #2E2058; --brand-active: rgba(255, 255, 255, .14);
  --bg: #100E1C; --surface: #191529; --surface-2: #221D38; --line: #332C4F; --line-soft: #2A2442;
  --ink: #F3F1FA; --body: #E1DDF0; --muted: #B9B3D0; --faint: #8F89A8;
  --accent: #A78BFA; --accent-ink: #C4B5FD; --accent-soft: rgba(167, 139, 250, .16); --focus: #C4B5FD;
  --btn-a: #7C4DDB; --btn-b: #6A35BE;
  --s1: #9B7BFF; --s2: #F5A623; --s3: #6F5FB0; --s4: #E06060; --s5: #A3B33A;
  --good-ink: #8FD6A4; --warn-ink: #FBE27A; --serious-ink: #F7A27E; --critical-ink: #FF9A9A;
  --good-bg: rgba(62, 156, 91, .18); --warn-bg: rgba(224, 184, 0, .14); --serious-bg: rgba(232, 116, 42, .18); --critical-bg: rgba(209, 67, 67, .22);
  --info-bg: rgba(167, 139, 250, .16); --info-ink: #C4B5FD;
  --grid: rgba(255, 255, 255, .08);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 2px 10px rgba(0, 0, 0, .25); --shadow-lg: 0 24px 60px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--body); }
body { margin: 0; font: 14px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: .84em; }
h1, h2, h3 { color: var(--ink); margin: 0; text-wrap: balance; }
h1 { font: 700 1.35rem/1.25 var(--font-display); letter-spacing: -.015em; }
h2 { font: 700 1.02rem/1.3 var(--font-display); letter-spacing: -.01em; }
h3 { font-size: .95rem; font-weight: 700; }
.eyebrow { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
[hidden] { display: none !important; }
.bg { display: none; }

/* ---- top bar: brand, interface name, search, alerts, account */
.top { position: sticky; top: 0; z-index: 30; height: var(--top-h); display: flex; align-items: center; gap: 14px; padding: 0 var(--page-x) 0 0; background: var(--brand-top); color: var(--on-brand); }
.top-brand { display: flex; align-items: center; gap: 14px; height: 100%; flex: none; }
.top-brand .mark { min-width: var(--side-w); height: 100%; display: grid; place-items: center; padding: 0 22px; background: var(--brand-deep); }
.top-brand .mark img { height: 18px; width: auto; display: block; }
.logo { display: none; }
.app-id { display: flex; align-items: center; gap: 8px; min-width: 0; }
.app-id small { display: none; }
.app-id b { font-size: .95rem; color: var(--on-brand); white-space: nowrap; }
.app-id .crumb { color: var(--on-brand-muted); font-size: .86rem; white-space: nowrap; }
.top-tools { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; justify-content: flex-end; }
.search { position: relative; width: min(360px, 40vw); margin-right: auto; margin-left: auto; }
.search svg { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--on-brand-muted); pointer-events: none; }
.top .search input { width: 100%; height: 36px; border-radius: 99px; border: 1px solid rgba(255, 255, 255, .18); background: rgba(255, 255, 255, .14); padding: 0 40px 0 16px; color: var(--on-brand); }
.top .search input::placeholder { color: var(--on-brand-muted); }
.top .search input:focus { background: rgba(255, 255, 255, .22); border-color: rgba(255, 255, 255, .5); box-shadow: none; }
.icon-btn { position: relative; width: 36px; height: 36px; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; cursor: pointer; color: var(--on-brand); flex: none; }
.icon-btn:hover { background: var(--brand-active); }
.icon-btn svg { width: 19px; height: 19px; }
.count { font-family: var(--font-mono); font-size: .66rem; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--ks-red); color: #fff; display: inline-grid; place-items: center; font-weight: 700; }
.icon-btn .count { position: absolute; top: 1px; right: 1px; min-width: 16px; height: 16px; font-size: .6rem; border: 2px solid var(--brand-top); }
.ini { display: inline-grid; place-items: center; font-weight: 700; font-size: .78rem; color: #fff; background: linear-gradient(145deg, #F5A623, #E8742A); border-radius: 50%; }
.me-mini { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .6); flex: none; object-fit: cover; }
.avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; object-fit: cover; background: var(--surface-2); }
.avatar.ini, .me-mini.ini { background: linear-gradient(145deg, #F5A623, #E8742A); }

/* ---- rail + content */
.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: calc(100vh - var(--top-h)); }
.side { position: sticky; top: var(--top-h); align-self: start; height: calc(100vh - var(--top-h)); display: flex; flex-direction: column; gap: 4px; padding: 10px 8px; background: var(--brand-deep); overflow-y: auto; scrollbar-width: none; }
.side::-webkit-scrollbar { display: none; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-group { height: 1px; margin: 6px 10px; background: rgba(255, 255, 255, .14); font-size: 0; }
.nav-group:first-child { display: none; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 100%; border: 0; background: none; padding: 9px 2px 8px; border-radius: 10px; color: var(--on-brand-muted); font-weight: 600; font-size: .64rem; cursor: pointer; position: relative; line-height: 1.1; text-align: center; }
.tab svg { width: 20px; height: 20px; flex: none; }
.tab:hover { background: var(--brand-active); color: var(--on-brand); }
.tab[aria-selected="true"] { background: var(--brand-active); color: var(--on-brand); }
.tab[aria-selected="true"]::before { content: ""; position: absolute; left: -8px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: #fff; }
.tab .label { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: inherit; font-weight: inherit; color: inherit; letter-spacing: 0; }
.tab .count { position: absolute; top: 4px; right: 8px; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; align-items: center; }
.me { display: grid; place-items: center; padding: 8px 0 4px; }
.me img, .me .ini { width: 34px; height: 34px; border-radius: 50%; }
.me div { display: none; }
main { padding: var(--page-x); display: flex; flex-direction: column; gap: var(--section); min-width: 0; }
.dock { display: none; }

/* ---- responsive */
@media (max-width: 760px) {
  :root { --page-x: 16px; --section: 16px; --card-pad: 16px; --inner: 12px; --stack: 12px; --side-w: 52px; }
  .shell { display: block; min-height: calc(100vh - var(--top-h)); }
  .side { display: none; }
  .top { height: auto; flex-wrap: wrap; gap: 0 8px; padding: env(safe-area-inset-top, 0px) 10px 10px 0; }
  .top-brand { height: var(--top-h); gap: 10px; min-width: 0; flex: 1; }
  .top-brand .mark { padding: 0 12px; }
  .top-brand .mark img { height: 15px; }
  .app-id { min-width: 0; }
  .app-id b { overflow: hidden; text-overflow: ellipsis; font-size: .9rem; }
  .app-id .crumb { display: none; }
  .top-tools { display: contents; }
  .top .icon-btn, .top .acct { align-self: center; }
  .top .acct { margin-left: 4px; }
  .search { order: 5; flex-basis: 100%; width: 100%; margin: 0 0 0 10px; }
  main { padding: var(--page-x) var(--page-x) calc(84px + env(safe-area-inset-bottom, 0px)); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat { flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; }
  .stat .ic { width: 36px; height: 36px; }
  .dock { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--brand-deep); overflow-x: auto; scrollbar-width: none; }
  .dock::-webkit-scrollbar { display: none; }
  .dock button { flex: 1 0 64px; border: 0; background: none; border-radius: 10px; padding: 7px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .64rem; font-weight: 600; color: var(--on-brand-muted); position: relative; cursor: pointer; }
  .dock button svg { width: 20px; height: 20px; }
  .dock button[aria-current="page"] { background: var(--brand-active); color: var(--on-brand); }
  .dock .count { position: absolute; top: 2px; right: calc(50% - 20px); min-width: 16px; height: 16px; font-size: .6rem; padding: 0 4px; }
}

/* ---- page header and summary tiles */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: var(--section); }
.stat { display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.stat .ic { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); flex: none; }
.stat .ic svg { width: 20px; height: 20px; }
.stat .l { font-size: .74rem; color: var(--muted); font-weight: 600; }
.stat .v { font: 700 1.25rem/1.2 var(--font-body); color: var(--ink); font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.stat .v small { font: 600 .78rem/1.2 var(--font-body); color: var(--muted); }
.stat .v.good small { color: var(--good-ink); }
.stat .v.bad small { color: var(--critical-ink); }
.shapes { display: none; }

/* ---- cards and layout */
.card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.pad { padding: var(--card-pad); }
.pad.card-head { padding-bottom: 8px; }
.card-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card-title .section-title { flex-wrap: wrap; row-gap: 2px; }
.card-title .muted { font-size: .8rem; }
.view-all { border: 0; background: none; padding: 0; color: var(--accent-ink); font-weight: 600; font-size: .8rem; cursor: pointer; white-space: nowrap; }
.view-all:hover { text-decoration: underline; }
/* table text lines up with the card's own padding */
.card > .tbl-wrap th:first-child, .card > .tbl-wrap td:first-child { padding-left: var(--card-pad); }
.card > .tbl-wrap th:last-child, .card > .tbl-wrap td:last-child { padding-right: var(--card-pad); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: var(--section); align-items: start; }
.grid-half { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--section); align-items: start; }
.grid-main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--section); align-items: start; }
.section-stack { gap: var(--section); }
.sticky-col { position: sticky; top: calc(var(--top-h) + var(--page-x)); }
@media (max-width: 980px) { .sticky-col { position: static; } }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: var(--section); }
@media (max-width: 1100px) { .grid-main { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 980px) { .grid2, .grid-half { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: var(--stack); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.section-title { display: flex; align-items: baseline; gap: 10px; }
.section-title .muted { font-size: .85rem; }
/* quick actions: icon, label, chevron */
.qa { display: flex; flex-direction: column; }
.qa button { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-bottom: 1px solid var(--line-soft); background: none; padding: 12px 0; text-align: left; cursor: pointer; color: var(--ink); font-weight: 600; font-size: .9rem; }
.qa button:last-child { border-bottom: 0; }
.qa button:hover { color: var(--accent-ink); }
.qa .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); flex: none; }
.qa .ic svg { width: 15px; height: 15px; }
.qa .t { flex: 1; min-width: 0; }
.qa .chev { color: var(--faint); font-size: 1rem; }
.qa .count { margin-left: 4px; }

/* ---- forms */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .label { font-size: .78rem; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--stack); }
input[type=text], input[type=number], input[type=date], input[type=search], input[type=url], input[type=email], input[type=password], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 9px 12px; min-height: 42px; color: var(--ink); }
textarea { resize: vertical; min-height: 70px; }
input:hover, select:hover, textarea:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.err { color: var(--critical-ink); font-size: .82rem; font-weight: 600; }
.hint { color: var(--faint); font-size: .8rem; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 16px; border-radius: var(--r-sm); font-weight: 600; cursor: pointer; min-height: 40px; display: inline-flex; align-items: center; gap: 8px; justify-content: center; color: var(--ink); white-space: nowrap; transition: transform .12s ease, box-shadow .12s ease, background .12s ease; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.accent, .btn.primary { background: var(--btn-b); border-color: transparent; color: #fff; box-shadow: 0 4px 12px rgba(106, 53, 190, .24); }
.btn.accent:hover, .btn.primary:hover { background: var(--btn-a); box-shadow: 0 6px 16px rgba(106, 53, 190, .32); }
.btn.ghost { border-color: transparent; background: none; padding: 6px 12px; min-height: 34px; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.danger { color: var(--critical-ink); }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.btn.sm { min-height: 32px; padding: 5px 12px; font-size: .82rem; }
.btn svg { width: 16px; height: 16px; }

/* ---- chips, tags, pills */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 99px; font-size: .84rem; font-weight: 600; cursor: pointer; color: var(--ink); }
.chip:hover { border-color: var(--accent); color: var(--accent-ink); }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 700; padding: 3px 9px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-ink); white-space: nowrap; }
.tag.sub { background: var(--surface-2); color: var(--muted); }
.tag .dot { width: 7px; height: 7px; border-radius: 50%; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; font-weight: 700; padding: 3px 10px 3px 8px; border-radius: 99px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--good-bg); color: var(--good-ink); }
.pill.warn { background: var(--warn-bg); color: var(--warn-ink); }
.pill.serious { background: var(--serious-bg); color: var(--serious-ink); }
.pill.critical { background: var(--critical-bg); color: var(--critical-ink); }
.pill.info { background: var(--info-bg); color: var(--info-ink); }
.pill.neutral { background: var(--surface-2); color: var(--muted); }
.seg { display: inline-flex; flex-wrap: wrap; border-radius: 99px; padding: 3px; gap: 2px; background: var(--surface); border: 1px solid var(--line-soft); box-shadow: var(--shadow); }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 99px; font-size: .82rem; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.tile { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font: 700 .8rem/1 var(--font-body); color: #fff; flex: none; letter-spacing: .02em; box-shadow: inset 0 -10px 18px rgba(0, 0, 0, .14); }
.tile.sm { width: 30px; height: 30px; border-radius: 9px; font-size: .7rem; }

/* ---- tables and lists */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: left; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 700; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
td { padding: 12px 14px; border-bottom: 1px solid var(--line-soft); vertical-align: top; color: var(--body); }
tbody tr:hover td { background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: .82rem; }
.empty { text-align: center; padding: 40px 18px; color: var(--muted); }
.empty h3 { color: var(--ink); margin-bottom: 4px; font: 700 1.1rem var(--font-display); letter-spacing: -.01em; }
.list-row { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); }
.list-row:last-child { border-bottom: 0; }
.list-row .t { flex: 1; min-width: 0; }
.list-row .t b { color: var(--ink); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- designer task card */
.task { display: flex; flex-direction: column; gap: var(--stack); padding: var(--card-pad); }
.task-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.task-head { display: flex; gap: 14px; align-items: flex-start; }
.task-title { font-weight: 700; font-size: 1.04rem; color: var(--ink); }
.task.overdue { box-shadow: inset 3px 0 0 var(--critical), var(--shadow); }
.task.blocked { box-shadow: inset 3px 0 0 var(--warn), var(--shadow); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: .85rem; }
.progress { height: 7px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.update { background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: var(--r); padding: var(--inner); display: flex; flex-direction: column; gap: var(--stack); }
.update .fields { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); }
.stepper button { border: 0; background: none; width: 34px; height: 36px; cursor: pointer; font-size: 1.05rem; color: var(--ink); }
.stepper span { min-width: 26px; text-align: center; font-family: var(--font-mono); }
.stepper.sm button { width: 28px; height: 30px; }
.history { font-size: .84rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.history b { color: var(--ink); font-weight: 600; }
.items { display: flex; flex-direction: column; border: 1px solid var(--line-soft); border-radius: 12px; background: var(--surface); overflow: hidden; }
.item { display: grid; grid-template-columns: 30px minmax(120px, 1.4fr) minmax(128px, .8fr) auto minmax(140px, 1fr); gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line-soft); }
.item:last-child { border-bottom: 0; }
.item.done { background: var(--good-bg); }
.item .n { font-family: var(--font-mono); font-size: .76rem; color: var(--faint); text-align: center; }
.item input, .item select { min-height: 34px; padding: 5px 9px; font-size: .86rem; }
@media (max-width: 720px) { .item { grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1fr); } .item .ilink { grid-column: 2 / -1; } .item .stepper { grid-column: 2; } }
.batch-bar { display: flex; align-items: center; gap: 10px; }
.batch-bar .progress { flex: 1; }

/* ---- KPIs and charts */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: var(--stack); }
.kpi { padding: 14px 16px; }
.kpi .v { font: 700 1.7rem/1.1 var(--font-body); color: var(--ink); font-variant-numeric: tabular-nums; }

.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 12px; font-family: var(--font-body); }
.chart .lbl { fill: var(--ink); font-weight: 600; }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.bar-cell { display: flex; align-items: center; gap: 8px; min-width: 110px; }
.bar-cell .track { flex: 1; height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar-cell .track i { display: block; height: 100%; border-radius: 99px; background: var(--s1); }
.heat { display: grid; gap: 5px; }
.heat .cell { border-radius: 8px; padding: 7px 4px; text-align: center; font-family: var(--font-mono); font-size: .74rem; line-height: 1.2; min-width: 0; }
.heat .hd { font-size: .7rem; color: var(--faint); text-align: center; font-weight: 600; }
.heat .nm { font-weight: 600; font-size: .86rem; align-self: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
#tip { position: fixed; z-index: 70; pointer-events: none; background: var(--ks-ebony); color: #fff; font-size: .8rem; padding: 7px 10px; border-radius: 9px; max-width: 260px; box-shadow: var(--shadow-lg); white-space: pre-line; }

/* ---- funnel */
.funnel { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 10px; }
.stage { border: 1px solid var(--line-soft); background: var(--surface); border-radius: var(--r); padding: 13px 14px 11px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-width: 0; box-shadow: var(--shadow); color: var(--ink); }
.stage:hover { border-color: var(--accent); }
.stage .v { font: 700 1.4rem/1 var(--font-body); font-variant-numeric: tabular-nums; }
.stage .l { font-size: .72rem; font-weight: 600; color: var(--muted); }
.stage .meter { height: 4px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }

.req { display: flex; flex-direction: column; gap: var(--stack); }
.req-head { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }

.note-box { border-left: 3px solid var(--ks-orange); background: var(--warn-bg); color: var(--warn-ink); padding: 10px 12px; border-radius: 0 10px 10px 0; font-size: .9rem; }
.preview { font-family: var(--font-mono); font-size: .8rem; background: var(--surface-2); border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; overflow-wrap: anywhere; color: var(--body); }
.preview .k { color: var(--faint); }
.banner { padding: 12px 16px; border-radius: var(--r); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border: 1px solid var(--glass-line); }
.banner.info { background: var(--info-bg); color: var(--info-ink); }
.banner.warn { background: var(--warn-bg); color: var(--warn-ink); }
.banner.good { background: var(--good-bg); color: var(--good-ink); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 80; background: var(--ks-ebony); color: #fff; padding: 11px 18px; border-radius: 99px; font-weight: 600; box-shadow: var(--shadow-lg); max-width: calc(100% - 32px); }
@media (max-width: 760px) { .toast { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); } }
.list-edit { display: flex; flex-direction: column; gap: 6px; }
.list-edit .li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
.list-edit .li.two { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) auto; }
details > summary { cursor: pointer; font-weight: 600; color: var(--muted); list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "+ "; font-family: var(--font-mono); }
details[open] > summary::before { content: "- "; }
.skeleton { color: var(--faint); padding: 60px 0; text-align: center; }
.subtask { border: 1px solid var(--line-soft); border-radius: var(--r); padding: var(--inner); display: flex; flex-direction: column; gap: var(--stack); background: var(--surface); }
.subtask-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.subtask-head .n { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent-ink); font-family: var(--font-mono); font-size: .76rem; font-weight: 700; }
.form-section { display: flex; flex-direction: column; gap: var(--stack); }
.cap { font-size: .8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.gantt { display: flex; flex-direction: column; gap: 7px; min-width: 520px; }
.g-row { display: grid; grid-template-columns: minmax(120px, 210px) minmax(0, 1fr); gap: 10px; align-items: center; }
.g-label { font-size: .84rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.g-label small { color: var(--faint); }
.g-track { position: relative; height: 28px; background: var(--surface-2); border-radius: 8px; }
.g-bar { position: absolute; top: 4px; bottom: 4px; border-radius: 6px; color: #fff; font-size: .72rem; font-weight: 700; padding: 0 8px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 6px; box-shadow: 0 4px 10px rgba(17, 24, 39, .12); }
.g-axis { position: relative; height: 18px; font-size: .7rem; color: var(--faint); }
.g-axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.g-grid { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line-soft); }
.g-today { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ks-red); border-radius: 2px; }
.links { display: flex; flex-direction: column; gap: 10px; }
.link-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 14px; border: 1px solid var(--line-soft); border-radius: var(--r); background: var(--surface); }
.link-row code { font-family: var(--font-mono); font-size: .78rem; overflow-wrap: anywhere; color: var(--muted); }
/* ---- sign-in, account menu, dialogs */
body.auth .side, body.auth .top, body.auth .dock { display: none !important; }
body.auth .shell { display: block; max-width: 1100px; margin: 0 auto; min-height: 100vh; }
body.auth main { padding: clamp(16px, 5vh, 56px) var(--page-x); min-height: 100vh; justify-content: center; }

.auth-brand { position: relative; overflow: hidden; background: radial-gradient(120% 90% at 0% 0%, #7C4DDB, transparent 60%), radial-gradient(90% 80% at 100% 100%, rgba(245, 158, 11, .35), transparent 60%), #3B1F7A; color: #fff; padding: 40px; display: flex; flex-direction: column; justify-content: space-between; isolation: isolate; }

.auth-brand .shapes { display: block; position: absolute; right: 0; top: 0; bottom: 0; width: 70%; opacity: .95; pointer-events: none; }
.shape { position: absolute; }
.torus { width: 200px; height: 200px; right: 6%; top: 50%; margin-top: -86px; border-radius: 50%; background: radial-gradient(circle at 36% 30%, #E4DAFF 0 8%, #B39BFF 22%, #6A35BE 58%, #2A1560 100%); -webkit-mask: radial-gradient(circle, transparent 29%, #000 30.5%); mask: radial-gradient(circle, transparent 29%, #000 30.5%); transform: rotate(-24deg) scaleY(.78); filter: drop-shadow(0 18px 28px rgba(42, 21, 96, .45)); }
.sphere { width: 46px; height: 46px; border-radius: 50%; right: 44%; top: 16%; background: radial-gradient(circle at 32% 28%, #FFE1A8, #F59E0B 45%, #B86E00); box-shadow: 0 10px 20px rgba(184, 110, 0, .3); }
.cube { width: 38px; height: 38px; border-radius: 9px; right: 16%; top: 12%; background: linear-gradient(145deg, #FFB070, #E8742A 55%, #B84E10); transform: rotate(24deg); box-shadow: 0 10px 18px rgba(232, 116, 42, .3); }
.cone { width: 0; height: 0; right: 40%; bottom: 14%; border-left: 22px solid transparent; border-right: 22px solid transparent; border-bottom: 40px solid #C4B5F0; transform: rotate(-28deg); filter: drop-shadow(0 8px 10px rgba(42, 21, 96, .3)); }

@media (max-width: 860px) { .auth-wrap { grid-template-columns: minmax(0, 1fr); min-height: 0; } .auth-brand { padding: 28px var(--card-pad) 30px; min-height: 180px; } .auth-copy ul, .auth-brand .shapes { display: none; } .auth-card { padding: 28px var(--card-pad); } }
