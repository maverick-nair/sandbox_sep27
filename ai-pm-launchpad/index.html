<title>AI PM Launchpad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Deliberately dark-first "mission control" theme in KNOLSKAPE colours: ebony, gold, science blue, rainbow accents. */
:root{color-scheme:dark;
  --bg:#070B14;--panel:#111827;--panel-2:#182135;--panel-3:#202B44;--line:#26324D;--line-2:#34436A;
  --text:#E4E9F2;--muted:#95A2B8;--ink:#FFFFFF;
  --gold:#FBD300;--orange:#FF7103;--blue:#0337D8;--blue-hi:#5B86FF;--lime:#C2D02F;--red:#FF5A3C;--good:#3FCB7E;--warn:#FFB020;
  --display:Cambria,"Source Serif 4",Georgia,serif;
  --body:"Segoe UI","Noto Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --rainbow:linear-gradient(90deg,#FBD300,#FF7103,#0337D8,#C2D02F,#C12400);
  --r:12px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--body);font-size:15px;line-height:1.55;margin:0;
  background-image:linear-gradient(rgba(91,134,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(91,134,255,.045) 1px,transparent 1px);background-size:32px 32px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);color:var(--ink);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,3.4vw,38px)}h2{font-size:23px}h3{font-size:18px}
p{margin:0}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.gold{color:var(--gold)}
.muted{color:var(--muted)}
.wrap{max-width:1200px;margin:0 auto;padding-inline:18px}
.rainbow{height:3px;background:var(--rainbow)}
/* HUD */
header.hud{background:rgba(7,11,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.hud-row{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--rainbow);display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#111827}
.brand .mark span{background:#111827;color:var(--gold);width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:15px}
.brand small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.brand strong{font-family:var(--display);font-size:19px;color:var(--ink);line-height:1.1}
nav.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
nav.tabs button{background:none;border:0;padding:7px 12px;border-radius:7px;color:var(--muted);font-weight:600;font-size:14px}
nav.tabs button[aria-current="page"]{background:var(--panel-3);color:var(--ink)}
.stats{display:flex;align-items:center;gap:10px}
.stat{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink)}
.stat svg{flex-shrink:0}
.lvl-shield{width:26px;height:26px;display:grid;place-items:center;background:var(--gold);color:#111827;clip-path:polygon(50% 0,100% 18%,100% 62%,50% 100%,0 62%,0 18%);font-size:12px;font-weight:700}
.xpbar{width:90px;height:6px;border-radius:6px;background:var(--panel-3);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--rainbow);transition:width .6s}
main{padding-block:22px 70px}
/* Generic */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{border:1px solid var(--line-2);background:var(--panel-2);padding:10px 16px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink);transition:transform .08s, background .15s}
.btn:hover{background:var(--panel-3)}
.btn:active{transform:translateY(1px)}
.btn.go{background:var(--gold);border-color:var(--gold);color:#111827;box-shadow:0 4px 0 #A88D00}
.btn.go:hover{filter:brightness(1.06)}
.btn.go:active{box-shadow:0 1px 0 #A88D00;transform:translateY(3px)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 0 #021F7A}
.btn.blue:active{box-shadow:0 1px 0 #021F7A;transform:translateY(3px)}
.btn.ghost{background:none;border-color:transparent;color:var(--blue-hi);padding-inline:6px}
.btn.big{padding:13px 22px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--panel-3);color:var(--text);white-space:nowrap}
.chip.gold{background:var(--gold);color:#111827}.chip.blue{background:rgba(91,134,255,.18);color:#AFC3FF}.chip.good{background:rgba(63,203,126,.16);color:var(--good)}.chip.warn{background:rgba(255,176,32,.16);color:var(--warn)}.chip.bad{background:rgba(255,90,60,.16);color:var(--red)}
.notice{border:1px dashed var(--line-2);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--muted);margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice b{color:var(--ink)}
.stars{display:inline-flex;gap:2px}
.stars svg{width:16px;height:16px}
.stars.lg svg{width:40px;height:40px}
.star-on{fill:var(--gold)}.star-off{fill:var(--panel-3)}
/* Home */
.home{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.season{background:linear-gradient(135deg,#111827 0%,#152046 100%);border:1px solid var(--line);border-radius:16px;padding:20px 22px;position:relative;overflow:hidden;display:grid;gap:8px}
.season::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--rainbow)}
.season p{color:var(--muted);max-width:60ch}
.path{position:relative;margin-top:14px}
.path svg.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:6px;width:180px;text-align:center}
.node-btn{width:78px;height:78px;border-radius:50%;border:0;display:grid;place-items:center;position:relative;background:var(--panel-3);color:var(--muted);box-shadow:0 6px 0 #0D1322;transition:transform .1s}
.node-btn:hover:not([aria-disabled="true"]){transform:translateY(-2px)}
.node-btn:active:not([aria-disabled="true"]){transform:translateY(3px);box-shadow:0 2px 0 #0D1322}
.node-btn .ini{font-family:var(--display);font-weight:700;font-size:22px}
.node.open .node-btn{background:var(--blue);color:#fff;box-shadow:0 6px 0 #021F7A}
.node.done .node-btn{background:var(--gold);color:#111827;box-shadow:0 6px 0 #A88D00}
.node.boss .node-btn{width:96px;height:96px;background:linear-gradient(135deg,#FF7103,#C12400);color:#fff;box-shadow:0 6px 0 #6E1500}
.node.boss.locked .node-btn{background:var(--panel-3);color:var(--muted);box-shadow:0 6px 0 #0D1322}
.node.current .node-btn::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--gold);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.07)}}
.node .t{font-family:var(--display);font-weight:600;color:var(--ink);font-size:15px;line-height:1.2}
.node .s{font-size:12px;color:var(--muted)}
.node .start-tag{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:var(--gold);color:#111827;font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.node .start-tag::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--gold);border-bottom:0}
.chest .node-btn{width:62px;height:62px;border-radius:14px}
.chest.ready .node-btn{background:var(--lime);color:#111827;box-shadow:0 6px 0 #7B8414}
.chest.opened .node-btn{background:var(--panel-2);color:var(--muted)}
.side{display:grid;gap:16px}
.goal{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ring{--p:0;width:78px;height:78px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--panel-3) 0);display:grid;place-items:center}
.ring > div{width:60px;height:60px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--mono);font-weight:600;color:var(--ink);font-size:14px;text-align:center;line-height:1.1}
.ring small{display:block;font-size:10px;color:var(--muted)}
.league-row{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;font-size:14px}
.league-row.you{background:rgba(251,211,0,.12);outline:1px solid rgba(251,211,0,.4)}
.league-row b{font-family:var(--mono);color:var(--muted)}
.spark{background:linear-gradient(135deg,#1B2340,#111827);border:1px solid var(--line-2)}
.spark textarea,.plain{width:100%;min-height:80px;border:1px solid var(--line-2);border-radius:10px;padding:10px;background:var(--bg);resize:vertical;color:var(--text)}
.quote-line{border-left:3px solid var(--gold);padding-left:10px;font-family:var(--display);font-size:17px;color:var(--ink)}
/* Brief */
.brief{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.portrait{display:flex;gap:14px;align-items:center}
.face{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px;background:var(--gold);color:#111827;flex-shrink:0;position:relative}
.face.sm{width:44px;height:44px;border-radius:12px;font-size:16px}
.face .mood{position:absolute;bottom:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:3px solid var(--panel);background:var(--muted)}
.portrait strong{display:block;color:var(--ink);font-size:16px}
.portrait small{color:var(--muted);font-size:13px}
.list{margin:0;padding-left:18px;display:grid;gap:6px}
.crit-mini{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.crit-mini:last-child{border-bottom:0}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;font-weight:600;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--panel-3);color:var(--ink)}
/* Sim */
.sim{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.chat{display:flex;flex-direction:column;min-height:600px;padding:0;overflow:hidden}
.chat-head{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.chat-head .grow{flex:1;min-width:0}
.pips{display:flex;gap:4px}
.pips i{width:14px;height:6px;border-radius:3px;background:var(--panel-3)}
.pips i.used{background:var(--blue-hi)}
.msgs{flex:1;padding:18px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:60vh}
.msg{max-width:80%;padding:11px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
.msg.persona{background:var(--panel-3);color:var(--text);border-top-left-radius:4px}
.msg.learner{background:var(--blue);color:#fff;align-self:flex-end;border-top-right-radius:4px}
.msg .who-line{display:block;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.75;margin-bottom:3px}
.voice{align-self:flex-start;max-width:86%;font-size:14px;padding:6px 0 6px 12px;border-left:3px solid var(--vc,var(--gold));color:var(--text)}
.voice b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--vc,var(--gold));margin-right:6px}
.stamp{align-self:center;font-family:var(--display);font-weight:700;font-size:22px;color:var(--orange);border:3px solid var(--orange);padding:4px 14px;border-radius:8px;transform:rotate(-3deg);letter-spacing:.04em;animation:slam .35s cubic-bezier(.2,1.6,.4,1)}
.stamp small{display:block;font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:0;text-align:center}
@keyframes slam{from{transform:rotate(-3deg) scale(1.8);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}
.found-toast{align-self:center;background:rgba(63,203,126,.14);color:var(--good);font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;font-family:var(--mono)}
.typing{color:var(--muted);font-size:13px;display:flex;gap:4px;align-items:center}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
.composer{border-top:1px solid var(--line);padding:12px;display:grid;gap:8px;background:var(--panel-2)}
.composer textarea{width:100%;min-height:72px;resize:vertical;border:1px solid var(--line-2);border-radius:10px;padding:10px;background:var(--bg);color:var(--text)}
.gauge{display:grid;gap:5px}
.gauge .lab{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.gauge .lab b{font-family:var(--mono);color:var(--ink)}
.gbar{height:10px;border-radius:6px;background:var(--panel-3);position:relative;overflow:hidden}
.gbar i{position:absolute;inset:0 auto 0 0;border-radius:6px;transition:width .6s cubic-bezier(.2,.9,.3,1)}
.gbar.danger{outline:2px solid var(--red);animation:throb 1s infinite}
@keyframes throb{50%{outline-color:transparent}}
.delta{font-family:var(--mono);font-size:12px;font-weight:600;margin-left:6px;animation:rise 1.2s ease-out}
.delta.up{color:var(--good)}.delta.down{color:var(--red)}
@keyframes rise{from{transform:translateY(6px);opacity:0}30%{opacity:1}to{transform:none}}
.evidence{display:grid;gap:8px}
.ev{border:1px solid var(--line-2);border-radius:10px;padding:10px;font-size:13px;display:grid;gap:6px;background:var(--panel-2)}
.ev.locked{border-style:dashed;color:var(--muted);background:none}
.ev.found{border-color:rgba(63,203,126,.5)}
.ev .ev-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ev .ev-top b{color:var(--ink)}
.ev.used{opacity:.7}
/* Decide */
.options{display:grid;gap:10px}
.option{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line-2);border-radius:12px;padding:14px;background:var(--panel-2);cursor:pointer;transition:border-color .15s, transform .1s}
.option:hover{transform:translateY(-1px)}
.option:has(input:checked){border-color:var(--gold);background:rgba(251,211,0,.07)}
.option input{margin-top:4px;accent-color:var(--gold)}
.option .key{font-family:var(--mono);font-weight:700;color:var(--gold)}
input[type=range]{width:100%;accent-color:var(--gold)}
/* Result */
.result-hero{background:linear-gradient(135deg,#111827,#1A2550);border:1px solid var(--line);border-radius:18px;padding:26px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center;position:relative;overflow:hidden}
.result-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--rainbow)}
.bigscore{font-family:var(--display);font-size:84px;line-height:1;color:var(--ink);font-weight:700}
.bigscore small{font-size:20px;color:var(--muted);font-weight:500}
.results{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start;margin-top:18px}
.crit{display:grid;gap:6px;padding:14px 0;border-bottom:1px solid var(--line);animation:rise .5s ease-out both}
.crit:last-child{border-bottom:0}
.crit-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.crit-top b{color:var(--ink)}
.cpips{display:inline-flex;gap:3px}
.cpips i{width:20px;height:7px;border-radius:3px;background:var(--panel-3)}
.cpips i.on{background:var(--gold)}
.quote{font-size:13px;border-left:3px solid var(--line-2);padding-left:10px;color:var(--muted)}
.xp-list{display:grid;gap:6px;font-size:14px}
.xp-list div{display:flex;justify-content:space-between;gap:10px}
.xp-list b{font-family:var(--mono);color:var(--gold)}
.xp-list .total{border-top:1px solid var(--line);padding-top:6px;font-weight:700;color:var(--ink)}
.rewrite{display:grid;gap:8px;font-size:14px}
.rewrite .before{background:rgba(255,90,60,.1);padding:9px 11px;border-radius:10px}
.rewrite .after{background:rgba(63,203,126,.1);padding:9px 11px;border-radius:10px}
.reward{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:rgba(251,211,0,.1);border:1px solid rgba(251,211,0,.35);animation:rise .6s ease-out both}
.reward b{color:var(--ink)}
/* Badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.badge{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line)}
.medal{width:40px;height:44px;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--panel-3);color:var(--muted);flex-shrink:0;clip-path:polygon(50% 0,100% 20%,100% 70%,50% 100%,0 70%,0 20%)}
.badge.on .medal{background:var(--gold);color:#111827}
.badge small{display:block;color:var(--muted);font-size:12px}
.badge b{color:var(--ink);font-size:14px}
.badge:not(.on){opacity:.75}
/* Board */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;margin-bottom:14px}
.pod{border-radius:12px 12px 4px 4px;padding:12px 10px;text-align:center;display:grid;gap:4px;background:var(--panel-2);border:1px solid var(--line)}
.pod .pr{font-family:var(--display);font-size:26px;font-weight:700}
.pod.p1{min-height:150px;border-color:rgba(251,211,0,.55)}.pod.p1 .pr{color:var(--gold)}
.pod.p2{min-height:122px}.pod.p2 .pr{color:#C9D2E2}
.pod.p3{min-height:104px}.pod.p3 .pr{color:var(--orange)}
.pod .nm{font-weight:600;color:var(--ink);font-size:14px;overflow-wrap:anywhere}
.pod .vl{font-family:var(--mono);color:var(--muted);font-size:13px}
.board-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
td.r b{font-family:var(--mono);color:var(--ink)}
tr.you td{background:rgba(251,211,0,.1)}
.rank{font-family:var(--mono);font-weight:600;color:var(--ink)}
select{border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;background:var(--panel-2);color:var(--text)}
.board-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.pick{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line-2);border-radius:12px;padding:12px;background:var(--panel-2);cursor:pointer}
.pick:has(input:checked){border-color:var(--gold)}
.pick input{margin-top:4px;accent-color:var(--gold)}
.pick b{color:var(--ink);display:block}
.pick small{color:var(--muted);font-size:12px}
/* Profile */
.profile{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
.hist-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.radar text{font-family:var(--mono);font-size:9px;fill:var(--muted)}
.confirm{border:1px solid var(--red);background:rgba(255,90,60,.08);border-radius:10px;padding:12px;display:grid;gap:8px}
/* Onboarding */
.onb{max-width:840px;margin:0 auto;display:grid;gap:18px}
.onb-hero{text-align:center;display:grid;gap:12px;justify-items:center;padding:26px 10px 8px}
.onb-hero p{color:var(--muted);max-width:58ch;font-size:16px}
.loop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.loop div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:4px}
.loop b{font-family:var(--display);color:var(--ink);font-size:18px}
.loop .label{color:var(--gold)}
.squads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.crest{display:grid;justify-items:center;gap:8px;text-align:center;border:2px solid var(--line-2);border-radius:14px;padding:14px 8px;background:var(--panel-2);cursor:pointer}
.crest:has(input:checked){border-color:var(--sq);background:color-mix(in srgb,var(--sq) 10%,var(--panel-2))}
.crest input{position:absolute;opacity:0;pointer-events:none}
.crest .hex{width:52px;height:58px;background:var(--sq);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#111827;font-size:22px}
.crest b{color:var(--ink);font-size:14px}
.crest small{color:var(--muted);font-size:12px}
.crest:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:#111827;font-weight:600;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:25}
@media (max-width:980px){.home,.brief,.sim,.results,.board-layout,.profile{grid-template-columns:1fr}.msgs{max-height:none}}
@media (max-width:620px){.loop,.squads{grid-template-columns:1fr 1fr}.result-hero{grid-template-columns:1fr}.bigscore{font-size:64px}.xpbar{width:56px}.node{width:130px}.node .t{font-size:13px}.msg{max-width:92%}.stat .hide-sm{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

{ id:"promise", tier:1, title:"The two-week promise", minutes:8,
  persona:{name:"Priya Raman",initials:"PR",role:"Enterprise Sales Director, KNOLSKAPE",style:"warm, fast-talking, target-driven, impatient with jargon, genuinely wants the client to succeed"},
  setup:"Meridian Bank, a large BFSI client, wants AI Koach for its 4,000 relationship managers. Priya wants you to confirm it can go live in two weeks, gives accurate coaching every time, and can take coaching off managers' plates.",

    {id:"f3",text:"The contract renewal is in 6 weeks. The two-week date is Priya's own quarterly review.",hint:"why the deadline is two weeks",kw:["deadline","two weeks","2 weeks","timeline","when","date","renewal","why the rush","timing"]}

    {id:"c3",skill:"influence",name:"Proposes a plan Priya can sell",good:"Offers a concrete pilot: scope, timeline, success metric, owners."},

{ id:"evalgate", tier:1, title:"The eval gate", minutes:9,
  persona:{name:"Arjun Mehta",initials:"AM",role:"ML Lead, Conversation AI",style:"sharp, proud of the model, defensive about delays, respects evidence"},
  setup:"Arjun's team built an LLM auto-scorer that grades learners' Conversation AI sales roleplays. He wants to ship it to every client this Friday, replacing human assessor scoring.",
  objective:"Decide whether the scorer is ready. Find out how quality was measured, check it is fair across learners, and make a launch call you can defend.",
  opening:"Good news: the auto-scorer is done. It's fast, it's cheap, and the LLM judge rates it 91% accurate. I want to switch every client from human assessors to auto-scoring this Friday. You're the PM, so I just need your sign-off. We good?",
  facts:[
    {id:"f1",text:"Agreement with human assessors is only 0.62. The 91% is the LLM judge grading its own family of model.",hint:"how accuracy was measured against humans",kw:["human","assessor","agreement","accurate","accuracy","measured","how do you know","91","compare","judge","ground truth","kappa","correlat"]},
    {id:"f2",text:"For non-native English speakers, agreement drops to 0.48, so they get unfairly low scores.",hint:"differences between learner groups",kw:["fair","bias","accent","non-native","segment","group","subgroup","english","demographic","everyone","different learners","language"]},
    {id:"f3",text:"The eval set is 80 calls, all from a single pharma client.",hint:"the size and source of the eval set",kw:["eval set","dataset","data set","sample","how many","which calls","test set","examples","client","representative","size"]}

  moments:[

  rubric:[
    {id:"c1",skill:"evals",name:"Interrogates how quality was measured",good:"Asks for agreement with human assessors, the eval set size and source, and challenges the self-graded 91%."},
    {id:"c2",skill:"rai",name:"Checks fairness across learner groups",good:"Asks how scores differ for accents, languages or other groups and treats a gap as a blocker for high-stakes use."},
    {id:"c3",skill:"influence",name:"Makes a clear, defensible launch call",good:"States a decision with thresholds (for example agreement of 0.75 or more) and what would change it."},
    {id:"c4",skill:"uncertainty",name:"Reframes the claim honestly",good:"Suggests how to describe the scorer to clients without over-claiming, for example practice feedback, not certification."}

    {id:"a",label:"Ship auto-scoring to every client on Friday as planned.",pts:3,outcome:"Scores go live. Within a month, two clients notice non-native speakers failing certification at twice the usual rate. One client pauses Conversation AI and asks for a bias review."},
    {id:"b",label:"Ship it as practice feedback only, keep human scoring for certification, grow the eval set to 300 calls from 3 or more clients, and require 0.75 agreement with no group gap before scores count.",pts:25,outcome:"Learners get instant practice feedback, which they love. In five weeks the bigger eval set exposes and fixes the accent gap; agreement reaches 0.78 and certification scoring switches over with evidence behind it."},

{ id:"dataask", tier:1, title:"The data ask", minutes:9,
  persona:{name:"Meera Iyer",initials:"MI",role:"Head of L&D, Norvel Pharma (client)",style:"friendly, ambitious, under pressure from her sales leadership, not a data-privacy expert"},

/* ---------- Game helpers ---------- */
function starsFor(score, facts){ if(score<PASS) return 0; if(score>=90 && facts===3) return 3; if(score>=85) return 2; return 1; }
function bestStars(sid){ return P.attempts.filter(a=>a.s===sid).reduce((m,a)=>Math.max(m, a.stars ?? starsFor(a.score,a.facts)),0); }
function starSvg(on){ return `<svg viewBox="0 0 24 24" aria-hidden="true"><path class="${on?"star-on":"star-off"}" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg>`; }
function starsHtml(n, lg){ return `<span class="stars ${lg?"lg":""}" role="img" aria-label="${n} of 3 stars">${[1,2,3].map(i=>starSvg(i<=n)).join("")}</span>`; }
function practiceDays(){ return new Set([...P.attempts.map(a=>dayKey(a.at)), ...(P.sparks||[]).map(s=>s.day)]); }
function streakInfo(){
  const days=practiceDays(); const shields=Math.min(2, Math.floor(days.size/5));
  let n=0, used=0, t=Date.now();
  if(!days.has(dayKey(t))) t-=DAY;
  for(let guard=0; guard<400; guard++){
    if(days.has(dayKey(t))){ n++; t-=DAY; continue; }
    if(n>0 && used<shields && days.has(dayKey(t-DAY))){ used++; t-=DAY; continue; }
    break;

  return {n, shields:shields-used, today:days.has(dayKey(Date.now()))};
}

/* ---------- Celebration effects (Brilliant-style moments of delight) ---------- */
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function burst(count=90){
  if(reduceMotion) return;
  const c=$("fx"), ctx=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cols=["#FBD300","#FF7103","#0337D8","#C2D02F","#C12400","#FFFFFF"];
  const ps=Array.from({length:count},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*0.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:3+Math.random()*4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));
  let f=0;
  (function tick(){ ctx.clearRect(0,0,c.width,c.height); f++;
    for(const p of ps){ p.vy+=0.35; p.x+=p.vx; p.y+=p.vy; p.a+=0.2; ctx.fillStyle=p.c; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r); ctx.restore(); }
    if(f<110) requestAnimationFrame(tick); else ctx.clearRect(0,0,c.width,c.height); })();
}
function countUp(el, to){
  if(!el) return; if(reduceMotion){ el.textContent=to; return; }
  const t0=performance.now(), d=900;
  (function step(t){ const k=Math.min(1,(t-t0)/d); el.textContent=Math.round(to*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(step); })(t0);
}

function rating(attempts){

  const vals=Object.values(best); if(!vals.length) return {value:0,n:0};
  const mean=vals.reduce((x,y)=>x+y,0)/vals.length;

  const by={}; for(const a of [...attempts].sort((x,y)=>x.at-y.at)){ (by[a.s] ??= []).push(a.score); }

function transcriptText(run, s){

function personaPrompt(run, s, moment){
  return `You are role-playing ${s.persona.name}, ${s.persona.role}, in a practice simulation for KNOLSKAPE AI product managers. Every person and company here is fictional.
Character: ${s.persona.style}.
Situation: ${s.setup}

${s.facts.map(f=>`- ${f.id}: ${f.text} (reveal only if asked about ${f.hint})`).join("\n")}
Already revealed: ${[...run.revealed].join(", ") || "none"}.
When the PM cites evidence you revealed earlier to support a sound point, respect it: trust and clarity should rise.
React realistically: warm up when the PM asks sharp questions, gives honest limits and concrete plans; push harder when they are vague; be pleased but naive if they over-promise.
${moment ? `In this reply, after responding, raise this new pressure in your own words: "${moment}"` : ""}

Conversation so far:
${transcriptText(run, s)}

Reply with only a JSON object:
{"reply": string, "revealed": [ids of facts revealed in this reply], "trust": integer -10 to 10 (change in your trust of the PM from their latest message), "clarity": integer -10 to 10 (did they make the way forward clearer), "risk": integer -10 to 10 (positive if they reduced risk; negative if they over-promised or accepted something unsafe), "flags": array from ["overpromise","unsafe_accept","good_question","clear_tradeoff","empathy"], "voice": {"skill": one of ${JSON.stringify(Object.keys(SKILLS))}, "line": string (under 18 words: the PM's inner voice for that skill, noticing something useful for their next move, addressed as "you")}}`;
}
function assessPrompt(run, s, decision, rationale){
  return `You are a KNOLSKAPE Conversation AI assessor scoring an AI product manager's performance in a simulated stakeholder conversation. Be fair, specific and evidence-based. Quote the PM's own words as evidence.
Scenario: ${s.title}. ${s.setup}
Objective: ${s.objective}
Hidden facts the PM could uncover: ${s.facts.map(f=>f.id+": "+f.text).join(" | ")}. Uncovered: ${[...run.revealed].join(", ") || "none"}.
Transcript:
${transcriptText(run, s)}
Final decision chosen: "${decision.label}"
PM's rationale: "${rationale}"
Rubric (score each 0 to 4; 0 absent, 1 weak, 2 developing, 3 proficient, 4 excellent):
${s.rubric.map(c=>`- ${c.id} ${c.name}. Good looks like: ${c.good}`).join("\n")}
Reply with only JSON:
{"criteria":[{"id":"c1","score":0-4,"evidence":"short quote of the PM or 'none'","feedback":"one sentence"}, ... for c1 to c4],
"strengths":["one sentence","one sentence"], "gaps":["one sentence","one sentence"],
"rewrite":{"original":"one PM line quoted exactly","improved":"a better version of that line"},
"next":"one sentence on what to practise next"}`;
}
const hasAny = (t, kws) => kws.some(k => t.includes(k));
const OVER = ["guarantee","definitely","100%","98%","always","every time","no problem","sure, go","yes, go ahead","of course","absolutely","just do it","we can ship","ship it","start this week","take them all","no approvals","fully autonomous"];
const CAREFUL = ["pilot","phase","stage","metric","measure","eval","test","consent","anonym","human","manager","approve","risk","trade-off","tradeoff","threshold","evidence","data","limit","fair","review","cache","route"];
const VOICE_BANK = {
  discover:["Something is behind this request. What do they really need?","You haven't asked why yet.","Who are the actual users here?"],
  uncertainty:["Say what you know, what you don't, and when you will.","A number you can't defend is a promise you'll break.","Name the limit before they find it."],
  evals:["How was this measured, and on whose data?","A demo is not evidence.","Ask what 'accurate' means here."],
  rai:["Who could be harmed if this goes wrong?","Consent covers a purpose. Is this that purpose?","Where does a human stay in the loop?"],
  economics:["What does each successful outcome actually cost?","Follow the tokens.","Which users drive the cost?"],
  influence:["Give them something concrete they can say yes to.","Scope, metric, owner, date.","Offer a path, not just a no."]
};
const VOICE_LINES = Object.fromEntries(Object.entries(VOICE_BANK).map(([k,v])=>[k,v[0]]));
function offlinePersona(run, s, text, moment){
  const t=text.toLowerCase(); const revealed=[]; const flags=[];
  for(const f of s.facts){ if(!run.revealed.has(f.id) && hasAny(t,f.kw) && t.includes("?") ) { revealed.push(f.id); break; } }
  if(!revealed.length) for(const f of s.facts){ if(!run.revealed.has(f.id) && hasAny(t,f.kw)) { revealed.push(f.id); break; } }
  const negated=/\b(cannot|can't|won't|will not|not promise|don't|do not|never)\b/.test(t);
  const over=hasAny(t,OVER)&&!negated, careful=CAREFUL.filter(k=>t.includes(k)).length, q=(t.match(/\?/g)||[]).length;
  const cited=/evidence:/.test(t);
  if(over) flags.push("overpromise"); if(q) flags.push("good_question"); if(careful>=2) flags.push("clear_tradeoff");
  let reply;
  if(revealed.length){ const f=s.facts.find(x=>x.id===revealed[0]); reply = "Fair question. " + f.text + " Does that change what you'd recommend?"; }
  else if(over){ reply = "That's exactly what I wanted to hear. So I can go ahead and say yes to all of it?"; }
  else if(careful>=2 || cited){ reply = "Okay, that's more concrete than I expected. What would you need from me to make that happen, and how fast?"; }
  else if(q){ reply = "I'm not sure that's the right question. What do you actually need to know before we decide?"; }
  else { reply = "I hear you, but I need something I can act on. What's your recommendation?"; }
  if(moment) reply += " " + moment;
  const missing=s.facts.find(f=>!run.revealed.has(f.id) && !revealed.includes(f.id));
  const vskill = over ? "uncertainty" : missing ? "discover" : s.rubric[2].skill;
  return { reply, revealed, trust: over?2:(careful>=2||cited?6:(q?3:-4)), clarity: careful>=2||cited?7:(over?3:-3), risk: over?-9:(careful>=1?5:0), flags,
    voice:{skill:vskill, line: over ? "Careful. You just committed before checking the facts." : VOICE_BANK[vskill][run.learnerTurns % VOICE_BANK[vskill].length]} };
}
function offlineAssess(run, s, decision, rationale){
  const learner=run.turns.filter(t=>t.role==="learner").map(t=>t.text).join(" ").toLowerCase()+" "+rationale.toLowerCase();
  const q=run.turns.filter(t=>t.role==="learner" && t.text.includes("?")).length;
  const careful=CAREFUL.filter(k=>learner.includes(k)).length, over=run.flags.includes("overpromise");
  const found=run.revealed.size, dpts=decision.pts;
  const crit=s.rubric.map(c=>{
    let sc;
    if(c.skill==="discover") sc = clamp(Math.round(found*1.1 + (q>=3?1:0)),0,4);
    else if(c.skill==="rai") sc = clamp((careful>=3?2:1) + (dpts>=25?1:0) + (over?-1:1),0,4);
    else if(c.skill==="uncertainty") sc = clamp((over?1:3) + (learner.includes("limit")||learner.includes("not ")?1:0) - (dpts<10?1:0),0,4);
    else if(c.skill==="evals") sc = clamp((learner.includes("eval")||learner.includes("test")||learner.includes("agreement")?2:1) + (found>=2?1:0) + (dpts>=25?1:0),0,4);
    else if(c.skill==="economics") sc = clamp((learner.includes("cost")||learner.includes("₹")||learner.includes("value")||learner.includes("outcome")?2:1) + (found>=2?1:0) + (dpts>=25?1:0),0,4);
    else sc = clamp((dpts>=25?2:1) + (careful>=2?1:0) + (rationale.length>80?1:0) + (run.evidenceUsed.size>=1?1:0),0,4);
    return {id:c.id, score:sc, evidence:"none", feedback: sc>=3 ? "Solid evidence of this behaviour." : "Show this more explicitly in the conversation."};
  });
  return { criteria:crit, strengths:[found>=2?"You uncovered most of the hidden facts.":"You kept the conversation moving.", dpts>=25?"Your final decision balanced value and risk.":"You made a clear decision."],
    gaps:[over?"You over-promised before checking the facts.":"Ask more open questions early.", dpts<25?"Your decision left a major risk unmanaged.":"Tie your plan to a measurable outcome."],
    rewrite:null, next: found<3 ? "Replay and aim to uncover all three hidden facts before proposing." : "Try Expert mode without inner voices.", offline:true };
}
async function personaTurn(run, s, text, moment){
  if(RT.sample && RT.claudeState==="on"){
    try{
      run.ctl = new AbortController();
      const j = await RT.sample.json(personaPrompt(run, s, moment), {modelTier:"quick", cache:false, signal:run.ctl.signal});
      return normTurn(j, s, run);
    }catch(e){ if(e?.code==="cancelled") throw e; handleClaudeError(e); }
  }
  return offlinePersona(run, s, text, moment);
}
function normTurn(j, s, run){
  const ids=new Set(s.facts.map(f=>f.id));
  const n = v => clamp(Math.round(Number(v)||0), -10, 10);
  const vs = j?.voice && SKILLS[j.voice.skill] && j.voice.line ? {skill:j.voice.skill, line:String(j.voice.line).slice(0,160)} : null;
  return { reply: String(j?.reply || "Sorry, go on.").slice(0,900),
    revealed: Array.isArray(j?.revealed) ? j.revealed.map(String).filter(x=>ids.has(x) && !run.revealed.has(x)) : [],
    trust:n(j?.trust), clarity:n(j?.clarity), risk:n(j?.risk),
    flags: Array.isArray(j?.flags) ? j.flags.map(String).slice(0,5) : [], voice:vs };
}
function handleClaudeError(e){
  const code=e?.code;
  if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)){ RT.claudeState="off"; toast("Claude is not available in this view. Switched to scripted practice mode."); }
  else if(code==="rate_limited"){ toast("Claude is busy for your account right now. This turn used a scripted reply; try again in a minute."); }
  else if(code==="session_expired"){ toast("Your session expired. Sign in again to use Claude. This turn used a scripted reply."); }
  else { toast("Claude could not answer this turn, so a scripted reply was used."); }
  renderMe();
}

function startRun(sid){
  const s=scen(sid);
  S.run = { sid, mode:P.mode, turns:[{role:"persona",text:s.opening}], meters:{trust:50,clarity:40,risk:50}, delta:null, revealed:new Set(), evidenceUsed:new Set(), flags:[], learnerTurns:0, busy:false, draft:"", started:Date.now(), stage:"talk", decision:null, rationale:"", predicted:65, assessing:false, walkout:false };
  if(P.mode==="guided") S.run.turns.push({role:"voice",skill:"discover",text:VOICE_LINES.discover});

}
function useEvidence(fid){
  const run=S.run, s=scen(run.sid); if(!run || !run.revealed.has(fid)) return;
  const tag=`(Evidence: ${FACT_SHORT[s.id][fid]}) `;
  if(!run.draft.includes(tag)) run.draft = tag + run.draft;
  run.evidenceUsed.add(fid); render(); const c=$("composer"); if(c){ c.focus(); c.setSelectionRange(c.value.length,c.value.length); }
}
async function sendTurn(){
  const run=S.run, s=scen(run.sid); const text=(run.draft||"").trim();
  if(!text || run.busy || run.learnerTurns>=MAX_TURNS || run.walkout) return;
  run.turns.push({role:"learner",text}); run.draft=""; run.learnerTurns++; run.busy=true; render(); scrollChat();
  const moment=s.moments.find(m=>m.after===run.learnerTurns)?.text || null;
  let r;
  try{ r = await personaTurn(run, s, text, moment); }
  catch(e){ run.busy=false; run.turns.pop(); run.learnerTurns--; run.draft=text; render(); return; }
  if(S.run!==run) return;
  if(moment) run.turns.push({role:"stamp",text:"Pressure!",sub:s.persona.name.split(" ")[0]+" raises the stakes"});
  run.turns.push({role:"persona",text:r.reply});
  for(const id of r.revealed){ run.revealed.add(id); run.turns.push({role:"found",text:"Evidence unlocked: "+FACT_SHORT[s.id][id]}); }
  const before={...run.meters};
  run.meters.trust=clamp(run.meters.trust+r.trust*2,0,100);
  run.meters.clarity=clamp(run.meters.clarity+r.clarity*2,0,100);
  run.meters.risk=clamp(run.meters.risk+r.risk*2,0,100);
  run.delta={trust:run.meters.trust-before.trust, clarity:run.meters.clarity-before.clarity, risk:run.meters.risk-before.risk};
  run.flags.push(...r.flags);
  if(run.mode==="guided" && r.voice) run.turns.push({role:"voice",skill:r.voice.skill,text:r.voice.line});
  run.busy=false;
  if(run.meters.trust<=5){ run.walkout=true; run.turns.push({role:"stamp",text:"Walk-out",sub:s.persona.name.split(" ")[0]+" has ended the meeting"}); }
  render(); scrollChat(); if(r.revealed.length) burst(40);
  if(!run.walkout) $("composer")?.focus();
}
function scrollChat(){ setTimeout(()=>{ const m=$("msgs"); if(m) m.scrollTop=m.scrollHeight; },30); }
async function submitDecision(){
  const run=S.run, s=scen(run.sid);
  const decision=s.options.find(o=>o.id===run.decision);
  if(!decision){ toast("Choose a decision first."); return; }
  if((run.rationale||"").trim().length<20){ toast("Add a sentence or two on why. The assessor scores your reasoning too."); $("rationale")?.focus(); return; }
  run.assessing=true; render();
  let a=null, note="";
  if(RT.sample && RT.claudeState==="on"){
    try{
      run.ctl=new AbortController();
      a = await RT.sample.json(assessPrompt(run, s, decision, run.rationale.trim()), {modelTier:"default", cache:false, signal:run.ctl.signal});
      a = normAssess(a, s);
      if(!a) note="Claude's assessment could not be read, so the backup rubric scored this attempt.";
    }catch(e){ if(e?.code==="cancelled"){ run.assessing=false; render(); return; } handleClaudeError(e); note="Claude could not assess this attempt, so the backup rubric scored it."; }
  }
  if(!a){ a=offlineAssess(run, s, decision, run.rationale); if(!note) note="Scored by the scripted backup rubric, because Claude is not available in this view."; }
  if(S.run!==run) return;
  finishAttempt(run, s, decision, a, note);
}
function normAssess(a, s){
  if(!a || !Array.isArray(a.criteria)) return null;
  const crit=s.rubric.map(c=>{ const x=a.criteria.find(k=>String(k.id)===c.id)||{}; return {id:c.id, score:clamp(Math.round(Number(x.score)||0),0,4), evidence:String(x.evidence||"none").slice(0,300), feedback:String(x.feedback||"").slice(0,300)}; });
  const arr = v => Array.isArray(v) ? v.map(String).slice(0,3) : [];
  const rw = a.rewrite && a.rewrite.original && a.rewrite.improved ? {original:String(a.rewrite.original).slice(0,400), improved:String(a.rewrite.improved).slice(0,400)} : null;
  return {criteria:crit, strengths:arr(a.strengths), gaps:arr(a.gaps), rewrite:rw, next:String(a.next||"").slice(0,300)};
}
function finishAttempt(run, s, decision, a, note){
  const rubricPct = a.criteria.reduce((x,c)=>x+c.score,0)/(4*s.rubric.length);
  const discovery = run.revealed.size/s.facts.length;
  let score = Math.round(rubricPct*60 + decision.pts + discovery*15);
  if(run.walkout) score = Math.min(score, 69);
  const stars = starsFor(score, run.revealed.size);
  const prevBest = bestFor(P.attempts, s.id), prevStars = bestStars(s.id);
  const skillScores={}; for(const c of s.rubric){ const cs=a.criteria.find(x=>x.id===c.id).score; skillScores[c.skill]=Math.max(skillScores[c.skill]??0, cs); }
  const attempt = {id:"a"+Date.now(), s:s.id, score, stars, at:Date.now(), decision:decision.id, facts:run.revealed.size, evidence:run.evidenceUsed.size, mode:run.mode, predicted:Number(run.predicted), over:run.flags.includes("overpromise"), walkout:run.walkout, skillScores, turns:run.learnerTurns};
  const mult=TIERS[s.tier].mult, xp=[];
  if(prevBest==null) xp.push(["Mission score x"+mult, Math.round(score*mult)]);
  else { xp.push(["Replay completed",10]); if(score>prevBest) xp.push(["Beat your best by "+(score-prevBest), Math.round((score-prevBest)*2*mult)]); }
  if(stars>prevStars) xp.push([`New star${stars-prevStars>1?"s":""} (${stars} of 3)`, (stars-prevStars)*25]);
  const before = new Set(P.badges), afterAttempts=[...P.attempts, attempt];
  const earned=[]; const give = id => { if(!before.has(id) && !earned.includes(id)) earned.push(id); };
  give("first");
  if(attempt.facts===s.facts.length) give("questions");
  if(score>=PASS && !attempt.over) give("straight");
  if(score>=PASS && ["dataask","agentic"].includes(s.id) && decision.pts>=25) give("redline");
  if(prevBest!=null && score-Math.min(...P.attempts.filter(x=>x.s===s.id).map(x=>x.score))>=15) give("comeback");
  if(Math.abs(attempt.predicted-score)<=10) give("calibrated");
  if(score>=PASS && run.mode==="expert") give("unassisted");
  if(["promise","evalgate","dataask"].every(id=>passedIds(afterAttempts).includes(id))) give("core");
  if(s.id==="agentic" && score>=PASS) give("boardroom");
  if(attempt.evidence>=2) give("evidence");
  if(stars===3) give("threestar");
  for(const b of earned) xp.push(["Badge: "+BADGES.find(x=>x.id===b).name, BADGE_XP]);
  const ch=weeklyChallenge();
  if(ch.sid===s.id && score>=ch.target && !P.challenges.includes(ch.week)){ xp.push(["Weekly challenge",CHALLENGE_XP]); P.challenges.push(ch.week); }
  const gained = xp.reduce((x,[,v])=>x+v,0);
  const oldLevel=levelOf(P.xp).n, oldRatings=skillRatings(P.attempts), oldUnlocked=SCENARIOS.filter(isUnlocked).map(x=>x.id), oldStreak=streakInfo().n;
  attempt.xp=gained;
  P.attempts.push(attempt); P.attempts=P.attempts.slice(-200); P.xp+=gained; P.badges.push(...earned);
  const st=streakInfo();
  if(st.n>=3) { if(!P.badges.includes("streak3")){ P.badges.push("streak3"); earned.push("streak3"); P.xp+=BADGE_XP; } }
  const newUnlocks=SCENARIOS.filter(x=>isUnlocked(x) && !oldUnlocked.includes(x.id));
  saveProfile();
  S.result = {attempt, s, decision, a, note, xp, gained, earned, prevBest, prevStars, levelUp: levelOf(P.xp).n>oldLevel, oldRatings, newRatings:skillRatings(P.attempts), newUnlocks, meters:{...run.meters}, streakUp: st.n>oldStreak ? st.n : 0};
  S.run=null; S.view="result"; render(); window.scrollTo(0,0);
  countUp($("bigscore-n"), score);
  if(score>=PASS) setTimeout(()=>burst(stars>=3?160:100), 300);
}
function openChest(id){
  const node=PATH.find(n=>n.id===id); if(!node || P.chests.includes(id)) return;
  if(!node.needs.every(x=>passedIds(P.attempts).includes(x))){ toast("Pass the two missions before this chest to open it."); return; }
  const amount = 25 + Math.floor(Math.random()*36);
  const note = FIELD_NOTES[Math.floor(Math.random()*FIELD_NOTES.length)];
  P.chests.push(id); giveXp(amount, "Chest"); saveProfile(); render(); burst(70);
  S.chestNote={amount, note}; render();
}
async function submitSpark(){
  const sp=todaySpark(); const text=(S.spark.draft||"").trim();
  if(text.length<15){ toast("Write a full reply, at least a sentence."); return; }
  if(sparkDone()) return;
  S.spark.busy=true; render();
  let r=null;
  if(RT.sample && RT.claudeState==="on"){
    try{
      const j = await RT.sample.json(`You coach KNOLSKAPE AI product managers. Score this one-message reply from 0 to 10.
Stakeholder (${sp.who}) said: "${sp.line}"
PM replied: "${text}"
A strong reply ${sp.good}.
Reply with only JSON: {"score": integer 0-10, "feedback": "one sentence, specific", "better": "an improved reply under 45 words"}`, {modelTier:"quick", cache:false});
      r = {score:clamp(Math.round(Number(j?.score)||0),0,10), feedback:String(j?.feedback||"").slice(0,300), better:String(j?.better||"").slice(0,400)};
    }catch(e){ handleClaudeError(e); }
  }
  if(!r){ const t=text.toLowerCase(); const neg=/\b(cannot|can't|won't|not|don't)\b/.test(t); const over=hasAny(t,OVER)&&!neg; const c=CAREFUL.filter(k=>t.includes(k)).length;
    r = {score:clamp(4+c+(t.includes("?")?1:0)-(over?4:0),0,10), feedback: over?"This commits to something you can't yet back up.":"Scripted check: good use of specifics. Claude gives richer feedback on claude.ai.", better:""}; }
  const xp = r.score*3;

  P.sparks=P.sparks.slice(-120); P.xp+=xp; saveProfile();
  S.spark={draft:"", busy:false, result:{...r, xp}}; render(); if(r.score>=7) burst(60);
}

/* ---------- Simulation ---------- */
function gauge(label, v, d, color, help){
  const danger = v<=20;
  return `<div class="gauge" title="${esc(help)}"><div class="lab"><span>${label}${d?`<span class="delta ${d>0?"up":"down"}">${d>0?"+":""}${d}</span>`:""}</span><b>${Math.round(v)}</b></div><div class="gbar ${danger?"danger":""}"><i style="width:${v}%;background:${color}"></i></div></div>`;
}
function viewSim(){
  const run=S.run, s=scen(run.sid), first=s.persona.name.split(" ")[0];

  return `<div class="sim">
  <section class="panel chat">
    <div class="chat-head"><span class="face sm">${esc(s.persona.initials)}<span class="mood" style="background:${m.c}"></span></span>
      <div class="grow"><strong style="color:var(--ink)">${esc(s.persona.name)}</strong><div class="muted" style="font-size:12px">${esc(m.name)} · ${RT.claudeState==="on"?"played by Claude":"scripted practice"}</div></div>
      <div class="pips" aria-label="${run.learnerTurns} of ${MAX_TURNS} messages used">${Array.from({length:MAX_TURNS},(_,i)=>`<i class="${i<run.learnerTurns?"used":""}"></i>`).join("")}</div>
      <button class="btn ghost" data-action="quit">Leave</button></div>
    <div class="msgs" id="msgs">${run.turns.map(t=>{
      if(t.role==="stamp") return `<div class="stamp">${esc(t.text)}<small>${esc(t.sub)}</small></div>`;
      if(t.role==="found") return `<div class="found-toast">${esc(t.text)}</div>`;
      if(t.role==="voice") return `<div class="voice" style="--vc:${SKILL_COLOR[t.skill]}"><b>${esc(SKILLS[t.skill].name)}</b>${esc(t.text)}</div>`;
      return `<div class="msg ${t.role}"><span class="who-line">${t.role==="persona"?esc(first):"You"}</span>${esc(t.text)}</div>`; }).join("")}
      ${run.busy?`<div class="typing">${esc(first)} is typing <i></i><i></i><i></i></div>`:""}</div>
    <div class="composer">
      ${run.walkout ? `<p><b style="color:var(--red)">${esc(first)} walked out.</b> Your best score this attempt is capped at 69. Make your decision, then replay.</p>`
        : left>0?`<label for="composer" class="label">Your move</label><textarea id="composer" placeholder="Ask a question, name a limit, or propose a plan…" ${run.busy?"disabled":""}>${esc(run.draft)}</textarea>`:`<p><b>All ${MAX_TURNS} messages used.</b> Time to make the call.</p>`}
      <div class="row between"><span class="muted" style="font-size:12px">${run.walkout?"":left>0?"Ctrl+Enter to send":""}</span>
        <div class="row">${canDecide?`<button class="btn ${run.walkout||left===0?"go":""}" data-action="to-decide">Make the call</button>`:`<span class="muted" style="font-size:13px">Decide after ${MIN_TURNS-run.learnerTurns} more</span>`}${left>0&&!run.walkout?`<button class="btn blue" data-action="send" ${run.busy?"disabled":""}>Send</button>`:""}</div></div>
    </div>
  </section>
  <aside class="side">
    <section class="panel stack"><span class="label">Live read</span>
      ${gauge("Trust",run.meters.trust,d.trust,"#5B86FF","At zero the stakeholder walks out")}

    </section>
    <section class="panel stack"><div class="row between"><span class="label">Evidence locker</span><span class="chip ${run.revealed.size===3?"good":""} num">${run.revealed.size} / 3</span></div>
      <div class="evidence">${s.facts.map(f=>run.revealed.has(f.id)

}

/* ---------- Result ---------- */

  const rewards=[R.levelUp?`Level up: ${levelOf(P.xp).name}`:null, ...R.earned.map(b=>"Badge: "+BADGES.find(x=>x.id===b).name), ...R.newUnlocks.map(u=>"Unlocked: "+u.title), R.streakUp?`${R.streakUp}-day streak`:null].filter(Boolean);

      <p class="muted">Rubric ${reasonPts}/60 · decision ${R.decision.pts}/25 · facts ${discPts}/15. You predicted ${R.attempt.predicted}: ${Math.abs(R.attempt.predicted-sc)<=10?"well calibrated.":R.attempt.predicted>sc?"you rated yourself higher than the evidence.":"you did better than you thought."}</p>

  <div class="results">

/* ---------- League ---------- */
function boardEntries(){
  const map=new Map();
  for(const r of RT.boardRows) map.set(r.id, r);
  map.set(RT.uid||"me", {id:RT.uid||"me", ...boardSummary(), you:true});
  return [...map.values()];
}
function periodFilter(atts){
  const p=S.board.period; if(p==="all") return atts;
  const since=Date.now()-(p==="week"?7:30)*DAY; return atts.filter(a=>a.at>=since);
}
function displayName(e){
  if(e.you) return (P.visibility==="name" && RT.names[e.id]) ? RT.names[e.id] : P.alias;
  if(e.visibility==="name" && RT.names[e.id]) return RT.names[e.id];
  return e.alias || "Learner";
}
async function refreshNames(){
  if(!RT.user) return;
  const ids=boardEntries().filter(e=>(e.visibility==="name"||e.you) && e.id!=="me" && !e.demo).map(e=>e.id);
  if(!ids.length) return;
  const ps=await RT.user.profiles(ids); let changed=false;
  for(const id of ids){ const n=ps[id]?.name||""; if(RT.names[id]!==n){ RT.names[id]=n; changed=true; } }
  if(changed && S.view==="board") $("app").innerHTML=viewBoard();
}
function viewBoard(){
  const b=S.board, entries=boardEntries();
  const tabs=[["overall","Overall"],["improved","Most improved"],["scenario","By mission"],["skill","By skill"],["squads","Squads"]];
  let head="", rows=[], explain="";
  const listed = e => e.you || e.visibility!=="private";
  if(b.tab==="overall"){
    explain="Readiness rating: your best score on each mission, weighted for difficulty (Core x1.0, Advanced x1.1, Boss x1.2), averaged. Full weight after 3 missions. Retrying only helps if you do better.";
    rows=entries.filter(listed).map(e=>{const atts=periodFilter(e.attempts||[]); const r=rating(atts); return {e, v:r.value, sub:r.n+" missions", n:atts.length};}).filter(x=>x.n>0); head="Rating";
  } else if(b.tab==="improved"){
    explain="Average gain from first to best attempt on missions you replayed. Rewards learning, whatever your starting point.";
    rows=entries.filter(listed).map(e=>{const imp=improvement(periodFilter(e.attempts||[])); return {e, v:imp, sub:"points gained"};}).filter(x=>x.v!=null); head="Avg gain";
  } else if(b.tab==="scenario"){
    explain="Best score on this mission. Ties go to whoever got there in fewer attempts.";
    rows=entries.filter(listed).map(e=>{const atts=periodFilter(e.attempts||[]).filter(a=>a.s===b.scenario); if(!atts.length) return null; return {e, v:Math.max(...atts.map(a=>a.score)), sub:atts.length+" attempt"+(atts.length>1?"s":""), tie:atts.length};}).filter(Boolean); head="Best";
  } else if(b.tab==="skill"){
    explain="Skill rating 0 to 4: your best assessor score for this skill on each mission that tests it, averaged.";
    rows=entries.filter(listed).map(e=>{const r=skillRatings(periodFilter(e.attempts||[]))[b.skill]; return r==null?null:{e, v:Math.round(r*100)/100, sub:profLevel(r)};}).filter(Boolean); head="Rating";
  } else {
    explain="Squads rank by the average rating of active members, so a small squad can beat a large one. Private learners are not counted.";
    const sq={}; for(const e of entries){ if(e.you && P.visibility==="private") continue; if(!e.you && e.visibility==="private") continue; const atts=periodFilter(e.attempts||[]); if(!atts.length) continue; (sq[e.team] ??= []).push(rating(atts).value); }
    rows=Object.entries(sq).map(([t,vs])=>({team:t, v:Math.round(vs.reduce((x,y)=>x+y,0)/vs.length*10)/10, sub:vs.length+" active", mine:t===P.team})); head="Avg rating";
  }
  rows.sort((x,y)=> (y.v-x.v) || ((x.tie||0)-(y.tie||0)));
  const you = rows.findIndex(r=>r.e?.you);
  const nm = r => b.tab==="squads" ? esc(SQUADS[r.team]||r.team) : esc(displayName(r.e));
  const podium = rows.length>=3 ? `<div class="podium">${[1,0,2].map(i=>{const r=rows[i]; return `<div class="pod p${i+1}"><span class="pr">${i+1}</span><span class="nm">${nm(r)}${(r.e?.you||r.mine)?' <span class="chip gold">You</span>':""}</span><span class="vl">${r.v}</span></div>`;}).join("")}</div>` : "";
  const hasDemo = RT.boardRows.some(r=>r.demo);
  const table = rows.length ? `${podium}<div class="table-wrap"><table><thead><tr><th>Rank</th><th>${b.tab==="squads"?"Squad":"Player"}</th>${b.tab==="squads"?"":"<th>Squad</th>"}<th class="r">${head}</th><th>Detail</th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr class="${(r.e?.you||r.mine)?"you":""}"><td class="rank">${i+1}</td><td>${nm(r)}${r.e?.you?' <span class="chip gold">You</span>':""}${r.e?.demo?' <span class="chip">Sample</span>':""}</td>${b.tab==="squads"?"":`<td class="muted">${esc(SQUADS[r.e.team]||"")}</td>`}<td class="r"><b>${r.v}</b></td><td class="muted">${esc(r.sub)}</td></tr>`).join("")}
  </tbody></table></div>` : `<p class="muted" style="padding:20px 0">No results in this view yet. ${b.tab==="improved"?"Replay a mission to show improvement.":"Finish a mission to appear here."}</p>`;
  return `<div class="stack" style="margin-bottom:14px"><span class="label gold">Season 1 league</span><h1>Ranked on skill and growth, not hours logged.</h1></div>
  ${!RT.db?`<div class="notice"><span class="chip warn">Just you</span><span>The shared cohort league needs this page open on claude.ai. You are seeing your own results only.</span></div>`:hasDemo?`<div class="notice"><span class="chip">Sample</span><span>Rows marked Sample are demo players that show how a full cohort looks.</span></div>`:""}
  <div class="board-layout"><section class="panel">
    <div class="board-controls"><div class="seg" role="tablist" aria-label="League view">${tabs.map(([k,l])=>`<button role="tab" data-action="btab" data-tab="${k}" aria-pressed="${b.tab===k}">${l}</button>`).join("")}</div>
      <div class="row">${b.tab==="scenario"?`<select id="b-scenario" aria-label="Mission">${SCENARIOS.map(s=>`<option value="${s.id}" ${b.scenario===s.id?"selected":""}>${esc(s.title)}</option>`).join("")}</select>`:""}
        ${b.tab==="skill"?`<select id="b-skill" aria-label="Skill">${Object.entries(SKILLS).map(([k,v])=>`<option value="${k}" ${b.skill===k?"selected":""}>${esc(v.name)}</option>`).join("")}</select>`:""}
        <select id="b-period" aria-label="Time period"><option value="week" ${b.period==="week"?"selected":""}>This week</option><option value="month" ${b.period==="month"?"selected":""}>Last 30 days</option><option value="all" ${b.period==="all"?"selected":""}>All season</option></select></div></div>
    <p class="muted" style="font-size:13px;margin-bottom:12px">${esc(explain)}</p>
    ${table}
    ${you>=0?`<p style="margin-top:12px;font-size:14px">You are <b class="gold">#${you+1}</b> of ${rows.length}${P.visibility==="private"?" (only you can see this)":""}.</p>`:""}
  </section>
  <aside class="side">
    <section class="panel stack"><span class="label">Your visibility</span>
      ${[["alias","Codename",`Shown as "${P.alias}"`],["name","My name","Visible to your organisation"],["private","Private","Only you see your rank"]].map(([k,l,d])=>`<label class="pick"><input type="radio" name="bvis" value="${k}" ${P.visibility===k?"checked":""}><span><b>${l}</b><small>${esc(d)}</small></span></label>`).join("")}</section>
    <section class="panel stack"><span class="label">Fair play</span><ul class="list" style="font-size:13px">
      <li>Only assessed attempts count. Starting a mission earns nothing.</li>
      <li>Your best score per mission counts, so grinding does not help.</li>
      <li>Harder missions weigh more; full weight after 3 missions.</li>
      <li>Most improved rewards learning from any starting point.</li>
      <li>Squads use averages, so size does not matter.</li></ul></section>
  </aside></div>`;
}

/* ---------- Profile ---------- */
function radar(R){
  const keys=Object.keys(SKILLS), cx=130, cy=120, rad=84;
  const pt=(i,v)=>{ const a=-Math.PI/2 + i*2*Math.PI/keys.length; return [cx+Math.cos(a)*rad*v, cy+Math.sin(a)*rad*v]; };
  const ring=v=>keys.map((_,i)=>pt(i,v).join(",")).join(" ");
  const poly=keys.map((k,i)=>pt(i,(R[k]??0)/4).join(",")).join(" ");
  const short={discover:"Discovery",uncertainty:"Uncertainty",evals:"Evals",rai:"Resp. AI",economics:"Economics",influence:"Influence"};
  return `<svg class="radar" viewBox="0 0 260 240" width="100%" style="max-width:320px" role="img" aria-label="Skill radar">
    ${[.25,.5,.75,1].map(v=>`<polygon points="${ring(v)}" fill="none" stroke="#26324D" stroke-width="1"/>`).join("")}
    ${keys.map((_,i)=>{const [x,y]=pt(i,1); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#26324D"/>`;}).join("")}
    <polygon points="${poly}" fill="rgba(251,211,0,.25)" stroke="#FBD300" stroke-width="2"/>
    ${keys.map((k,i)=>{const [x,y]=pt(i,1.2); return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" style="fill:${SKILL_COLOR[k]}">${short[k]}</text>`;}).join("")}
  </svg>`;
}
function viewProgress(){
  const L=levelOf(P.xp), N=nextLevel(P.xp), R=skillRatings(P.attempts), hist=[...P.attempts].sort((a,b)=>b.at-a.at).slice(0,20), st=streakInfo();
  return `<div class="row between" style="margin-bottom:16px"><div class="row" style="gap:14px"><span class="lvl-shield" style="width:56px;height:56px;font-size:22px">${L.n}</span><div><span class="label gold">${esc(P.alias)} · ${esc(SQUADS[P.team])}</span><h1>${esc(L.name)}</h1></div></div><span class="muted num">${P.xp} XP${N?` · ${N.xp-P.xp} to ${esc(N.name)}`:" · max level"}</span></div>
  <div class="profile">
    <div class="side">
      <section class="panel stack"><span class="label">Badges · ${P.badges.length} of ${BADGES.length}</span><div class="badges">${BADGES.map(b=>{const on=P.badges.includes(b.id); return `<div class="badge ${on?"on":""}"><span class="medal">${on?"★":"?"}</span><div><b>${esc(b.name)}</b><small>${esc(b.how)}</small></div></div>`;}).join("")}</div></section>
      <section class="panel"><span class="label">Mission log</span><div>${hist.length?hist.map(a=>{const s=scen(a.s); return `<div class="hist-row"><div><b style="color:var(--ink)">${esc(s?.title||a.s)}</b><div class="muted" style="font-size:12px">${new Date(a.at).toLocaleString()} · ${a.mode==="expert"?"Expert":"Guided"} · ${a.facts}/3 facts · +${a.xp||0} XP</div></div><span class="row" style="gap:6px">${starsHtml(a.stars ?? starsFor(a.score,a.facts))}<span class="chip ${a.score>=PASS?"good":"warn"} num">${a.score}</span></span><button class="btn" data-action="brief" data-sid="${a.s}">Replay</button></div>`;}).join(""):'<p class="muted">No missions yet.</p>'}</div></section>
    </div>
    <aside class="side">
      <section class="panel stack" style="justify-items:center"><span class="label" style="justify-self:start">Skill radar</span>${radar(R)}
        <div class="stack" style="width:100%;gap:8px">${Object.entries(SKILLS).map(([k,v])=>`<div class="row between" style="font-size:13px"><span style="color:${SKILL_COLOR[k]}">${esc(v.name)} <span class="muted">${esc(v.code)}</span></span><span class="muted">${profLevel(R[k])}</span></div>`).join("")}</div></section>
      <section class="panel stack"><span class="label">Streak</span><p class="row" style="gap:8px">${flame()}<b class="num" style="font-size:22px;color:var(--ink)">${st.n}</b> days ${st.shields?`· ${shieldIcon()} ${st.shields} shield${st.shields>1?"s":""}`:""}</p></section>
      <section class="panel stack"><span class="label">Settings</span>
        <label for="set-team" class="muted" style="font-size:13px">Squad</label><select id="set-team">${Object.entries(SQUADS).map(([k,v])=>`<option value="${k}" ${P.team===k?"selected":""}>${esc(v)}</option>`).join("")}</select>
        <div class="seg" role="group" aria-label="Default difficulty"><button data-action="mode" data-mode="guided" aria-pressed="${P.mode==="guided"}">Guided</button><button data-action="mode" data-mode="expert" aria-pressed="${P.mode==="expert"}">Expert</button></div>
        ${S.confirmReset?`<div class="confirm"><b>Delete all your progress?</b><span style="font-size:13px">XP, stars, badges and history will be removed and you leave the league. This cannot be undone.</span><div class="row"><button class="btn" data-action="reset-yes" style="border-color:var(--red);color:var(--red)">Delete my progress</button><button class="btn ghost" data-action="reset-no">Keep it</button></div></div>`:`<button class="btn ghost" data-action="reset" style="justify-self:start;color:var(--red)">Reset my progress</button>`}
      </section>
    </aside>
  </div>`;
}

/* ---------- Events ---------- */
document.addEventListener("click", e=>{
  const b=e.target.closest("[data-action]"); if(!b || b.getAttribute("aria-disabled")==="true" || b.disabled) return;
  const act=b.dataset.action;
  if(act==="nav"){ if(S.run?.busy) return; S.run=null; S.chestNote=null; S.view=b.dataset.view; S.confirmReset=false; render(); window.scrollTo(0,0); }
  else if(act==="brief"){ S.sid=b.dataset.sid; S.view="brief"; S.chestNote=null; render(); window.scrollTo(0,0); }
  else if(act==="mode"){ P.mode=b.dataset.mode; saveProfile(); render(); }
  else if(act==="start"){ startRun(b.dataset.sid); window.scrollTo(0,0); }
  else if(act==="send") sendTurn();
  else if(act==="evidence") useEvidence(b.dataset.fid);
  else if(act==="to-decide"){ S.run.stage="decide"; render(); window.scrollTo(0,0); }
  else if(act==="back-talk"){ S.run.stage="talk"; render(); scrollChat(); }
  else if(act==="submit") submitDecision();
  else if(act==="stop"){ S.run?.ctl?.abort(); }
  else if(act==="quit"){ S.run?.ctl?.abort(); S.run=null; S.view="brief"; render(); }
  else if(act==="chest") openChest(b.dataset.id);
  else if(act==="spark") submitSpark();
  else if(act==="btab"){ S.board.tab=b.dataset.tab; render(); }
  else if(act==="reset"){ S.confirmReset=true; render(); }
  else if(act==="reset-no"){ S.confirmReset=false; render(); }
  else if(act==="reset-yes"){ const keep={alias:P.alias}; P={...freshProfile(), ...keep, onboarded:true}; S.confirmReset=false; saveProfile(); render(); toast("Your progress was reset."); }
});
document.addEventListener("input", e=>{
  if(e.target.id==="composer" && S.run) S.run.draft=e.target.value;
  if(e.target.id==="rationale" && S.run) S.run.rationale=e.target.value;
  if(e.target.id==="spark") S.spark.draft=e.target.value;
  if(e.target.id==="predict" && S.run){ S.run.predicted=Number(e.target.value); $("predict-out").textContent=e.target.value; }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.name==="decision" && S.run) S.run.decision=t.value;
  if(t.id==="b-period"){ S.board.period=t.value; render(); }
  if(t.id==="b-scenario"){ S.board.scenario=t.value; render(); }
  if(t.id==="b-skill"){ S.board.skill=t.value; render(); }
  if(t.name==="bvis"){ P.visibility=t.value; saveProfile(); render(); toast(t.value==="private"?"You are now private. Only you see your rank.":"League visibility updated."); }
  if(t.id==="set-team"){ P.team=t.value; saveProfile(); toast("Squad updated."); }
});
document.addEventListener("keydown", e=>{ if(e.target.id==="composer" && e.key==="Enter" && (e.ctrlKey||e.metaKey)){ e.preventDefault(); sendTurn(); } });
document.addEventListener("submit", e=>{
  if(e.target.id!=="onb-form") return; e.preventDefault();
  const f=new FormData(e.target); P.mode=f.get("mode"); P.team=f.get("team"); P.visibility=f.get("vis"); P.onboarded=true; saveProfile();
  S.sid="promise"; S.view="brief"; render(); window.scrollTo(0,0);
});

/* ---------- Boot ---------- */
render();
(async function boot(){
  const CL = window.claude && typeof window.claude.use==="function" ? window.claude : null;
  if(!CL){ RT.claudeState="off"; render(); return; }
  const [sample, db, user] = await Promise.all([CL.use("sample").catch(()=>null), CL.use("db").catch(()=>null), CL.use("user").catch(()=>null)]);
  RT.sample=sample; RT.claudeState = sample ? "on" : "off"; RT.user=user;
  if(user){ try{ RT.uid = await user.id(); }catch{} }
  if(db && RT.uid){
    RT.db=db;
    try{
      const snap=await db.doc("data/users/"+RT.uid+"/launchpad").get();
      const remote=snap.exists ? snap.data() : null;
      if(remote && Array.isArray(remote.attempts) && (remote.attempts.length>P.attempts.length || (!P.onboarded && remote.onboarded))){
        P={...freshProfile(), ...JSON.parse(JSON.stringify(remote))}; try{ localStorage.setItem(STORE, JSON.stringify(P)); }catch{}
        if(S.view==="onboard" && P.onboarded) S.view="home";
      } else if(P.onboarded){ saveProfile(); }
    }catch{}
    db.collection("board").limit(500).onSnapshot(q=>{
      RT.boardRows = q.docs.filter(d=>d.id!==RT.uid).map(d=>({id:d.id, ...d.data()}));
      if((S.view==="board" || S.view==="home") && !S.run && document.activeElement?.id!=="spark") render();
    }, ()=>{});
  }
  if(!S.run) render(); else renderMe();
})();
</script>
